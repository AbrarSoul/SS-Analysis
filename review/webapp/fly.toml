# Ground-truth review server. See DEPLOY.md.
app = "gt-case-review-5ed9e9"
primary_region = "arn"

[env]
  DATA_DIR = "/data"
  PORT = "8080"

[[mounts]]
  source = "review_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
