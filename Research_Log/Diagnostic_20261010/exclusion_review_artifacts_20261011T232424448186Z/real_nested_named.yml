rules:
- id: vuln-jspdf-d8bb3b39
  languages:
  - javascript
  message: Vulnerable regex pattern for data URI parsing allows malicious charset
    specification. The regex should prevent 'charset=' from appearing in the charset
    parameter to avoid bypassing security checks. Fix by adding negative lookahead
    assertion (?!charset=) to prevent insecure charset handling.
  severity: ERROR
  metadata:
    source-url: github.com/MrRio/jsPDF/commit/d8bb3b39efcd129994f7a3b01b632164144ec43e
    category: security
    cwe: CWE-20
    technology:
    - javascript
  patterns:
  - pattern: 'var $EXTRACTEDINFO = /^data:(\w*\/\w*);*(charset=[\w=-]*)*;*$/.exec($MATCHER);

      '
  - pattern-inside: "function $FUNC(...) {\n  ...\n}"
