rules:
- id: vuln-ckeditor-oembed-plugin-10f6169e
  pattern: "'div(embeddedContent,oembed-provider-*) script': {\n    attributes: '*'\n\
    }\n"
  pattern-not: "'div(embeddedContent,oembed-provider-*) script': {\n    ...\n}\n"
  languages:
  - javascript
  message: Potential security vulnerability due to allowing all attributes on script
    tags within oEmbed content. This can lead to XSS attacks. Restrict the attributes
    or sanitize the input to prevent malicious scripts from executing.
  severity: ERROR
  metadata:
    source-url: github.com/w8tcha/CKEditor-oEmbed-Plugin/commit/10f6169e39510bbf5af913886037044458b9dc9b
    category: security
    cwe: CWE-79
    owasp: A7:2017-Cross-Site Scripting (XSS)
    references:
    - https://owasp.org/www-community/attacks/xss/
    technology: javascript
