rules:
- id: vuln-jspdf-d8bb3b39
  pattern: 'var extractedInfo = /^data:(\w*\/\w*);*(charset=[\w=-]*)*;*$/.exec($DATA)

    '
  pattern-not: 'var extractedInfo = /^data:(\w*\/\w*);*(charset=(?!charset=)[\w=-]*)*;*$/.exec($DATA)

    '
  languages:
  - javascript
  message: Potential ReDoS vulnerability due to improper regex handling of 'charset'
    in data URI. Ensure the regex pattern properly excludes repeated 'charset=' to
    prevent denial of service.
  severity: ERROR
  metadata:
    source-url: github.com/MrRio/jsPDF/commit/d8bb3b39efcd129994f7a3b01b632164144ec43e
    category: security
    cwe: CWE-400
    owasp: A6:2017-Security Misconfiguration
    references:
    - https://owasp.org/www-community/attacks/Regular_expression_Denial_of_Service_-_ReDoS
    technology: javascript
