rules:
- id: vuln-notesnook-e87f5e5f
  pattern: '><p lang="en" dir="ltr"><a href="${src}?ref_src=twsrc%5Etfw"></a></blockquote>
    <script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>
    `

    '
  pattern-not: 'const anchor = document.createElement("a");

    anchor.href = `${src}?ref_src=twsrc%5Etfw`;

    ...

    ><p lang="en" dir="ltr">${anchor.outerHTML}</p></blockquote> <script async src="https://platform.twitter.com/widgets.js"
    charset="utf-8"></script> `

    '
  languages:
  - typescript
  message: 'Directly embedding URLs in HTML without proper sanitization can lead to
    security vulnerabilities such as XSS. Use `document.createElement` to safely construct
    elements and set attributes.

    '
  severity: ERROR
  metadata:
    source-url: github.com/streetwriters/notesnook/commit/e87f5e5f899f45df28d7c0f33f15e9178d1fbcb7
    category: security
    cwe:
    - CWE-79
    owasp:
    - A7:2017-Cross-Site Scripting (XSS)
    references:
    - https://owasp.org/www-community/attacks/xss/
    technology:
    - typescript
