rules:
- id: vuln-notesnook-e87f5e5f
  languages:
  - typescript
  message: 'Detected potential cross-site scripting (XSS) vulnerability in the embed
    component of Notesnook.

    This pattern may allow an attacker to inject malicious scripts into the href attribute
    of the anchor tag.

    To fix this vulnerability, ensure that the href attribute is properly sanitized
    and does not contain any user-supplied input.

    '
  metadata:
    category: security
    cwe:
    - CWE-79
    owasp:
    - A3:2017-Sensitive Data Exposure
    references:
    - https://owasp.org/www-project-top-ten/2017/A3_2017-Sensitive_Data_Exposure
    - https://cwe.mitre.org/data/definitions/79.html
    source-url: https://github.com/streetwriters/notesnook/commit/e87f5e5f899f45df28d7c0f33f15e9178d1fbcb7
    technology:
    - typescript
  pattern: 'document.createElement\("a"\)

    .href = `${src}\?ref_src=twsrc%5Etfw"\)

    '
  pattern-not: "document.createElement\\(\"a\"\\)\n.href = `${src}\\?ref_src=twsrc%5Etfw\"\
    \\)\n.outerHTML = \n"
  severity: ERROR
