rules:
- id: vuln-notesnook-e87f5e5f
  languages:
  - typescript
  message: 'This code is vulnerable to a cross-site scripting (XSS) attack because
    it uses user input in an unsafe way. The `src` variable is not properly sanitized,
    which allows an attacker to inject malicious JavaScript code into the page.

    '
  metadata:
    category: security
    cwe: CWE-79
    owasp: A3
    references:
    - links to documentation or standards
    source-url: github.com/streetwriters/notesnook/commit/e87f5e5f899f45df28d7c0f33f15e9178d1fbcb7
    technology: typescript
  pattern: "(\n  anchor = document.createElement(\"a\")\n  anchor.href = $src + \"\
    ?ref_src=twsrc%5Etfw\"\n)\n.*\n(\n  <p lang=\"en\" dir=\"ltr\">${anchor.outerHTML}</p>\n\
    )\n"
  pattern-not: "(\n  anchor = document.createElement(\"a\")\n  anchor.href = $src\
    \ + \"?ref_src=twsrc%5Etfw\"\n)\n.*\n(\n  <p lang=\"en\" dir=\"ltr\">${anchor.outerHTML}</p>\n\
    )\n"
  severity: ERROR
