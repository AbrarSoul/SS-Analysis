rules:
- id: vuln-git-pull-or-clone-f9ce092b
  patterns:
  - pattern: const $ARGS = ['clone', $FLAG, $URL, $OUTPATH]
  - pattern-not: const $ARGS = ['clone', $FLAG, '--', $URL, $OUTPATH]
  languages:
  - javascript
  message: Potential command injection vulnerability in git clone command. Ensure
    '--' is used to separate options from positional arguments to prevent URL from
    being interpreted as an option. Fix by adding '--' before the URL.
  severity: ERROR
  metadata:
    category: security
    cwe: CWE-78
    owasp: A1:2017-Injection
    source-url: github.com/feross/git-pull-or-clone/commit/f9ce092be13cc32e685dfa26e7705e9c6e3108a3
    technology:
    - javascript
