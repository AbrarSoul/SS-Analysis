rules:
- id: vuln-micronaut-core-9d1eff5c
  patterns:
  - pattern: new DefaultHttpHeaders(false)
  - pattern-not: new DefaultHttpHeaders()
  languages:
  - java
  message: Insecure configuration of DefaultHttpHeaders with validateHeaders set to
    false. This can lead to security vulnerabilities due to unvalidated headers. Use
    the default constructor to ensure headers are validated.
  severity: ERROR
  metadata:
    category: security
    cwe: CWE-20
    owasp: A6-Security Misconfiguration
    source-url: github.com/micronaut-projects/micronaut-core/commit/9d1eff5c8df1d6cda1fe00ef046729b2a6abe7f1
    technology:
    - java
