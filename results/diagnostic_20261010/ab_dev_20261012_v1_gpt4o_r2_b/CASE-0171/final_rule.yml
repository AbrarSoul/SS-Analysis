rules:
- id: vuln-graphhopper-eb189be1
  patterns:
  - pattern: $URL = $URL.replaceFirst("/navigate/directions/v5/gh/" + $PROFILE + "/",
      "");
  - pattern-not: if (!$URL.startsWith($URL_START)) throw new IllegalArgumentException("Incorrect
      URL " + $URL);
  - pattern-not: $URL = $URL.substring($URL_START.length());
  languages:
  - java
  message: Potential URL manipulation vulnerability. The code replaces parts of the
    URL without validating its structure, which can lead to incorrect URL processing
    and potential security issues. Ensure the URL starts with the expected prefix
    before modifying it.
  severity: ERROR
  metadata:
    category: security
    cwe: CWE-20
    owasp: A5:2017-Broken Access Control
    source-url: github.com/graphhopper/graphhopper/commit/eb189be1fa7443ebf4ae881e737a18f818c95f41
    technology:
    - java
