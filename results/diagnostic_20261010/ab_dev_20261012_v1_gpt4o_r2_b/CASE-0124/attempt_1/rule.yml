rules:
- id: vuln-sagemaker-python-sdk-2d873d53
  patterns:
  - pattern: os.system($COMMAND)
  - pattern-not: subprocess.run($COMMAND, check=True, capture_output=True)
  languages:
  - python
  message: Detected use of os.system() for executing shell commands, which can lead
    to command injection vulnerabilities. Use subprocess.run() with a list of arguments
    instead to avoid shell injection risks.
  severity: ERROR
  metadata:
    category: security
    cwe: CWE-78
    owasp: A1:2017-Injection
    source-url: github.com/aws/sagemaker-python-sdk/commit/2d873d53f708ea570fc2e2a6974f8c3097fe9df5
    technology:
    - python
