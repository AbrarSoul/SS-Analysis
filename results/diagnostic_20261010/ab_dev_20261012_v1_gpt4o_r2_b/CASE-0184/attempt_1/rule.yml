rules:
- id: vuln-git-client-plugin-75ea3fe0
  patterns:
  - pattern: File.createTempFile($PREFIX, $SUFFIX)
  - pattern-not: Files.createTempFile($PREFIX, $SUFFIX, $FILE_ATTRIBUTE)
  languages:
  - java
  message: Insecure temporary file creation detected. Creating temporary files without
    specifying file permissions can lead to security vulnerabilities, such as unauthorized
    access or modification. Use Files.createTempFile with appropriate file attributes
    to set secure permissions.
  severity: ERROR
  metadata:
    category: security
    cwe: CWE-377
    owasp: 'A6: Security Misconfiguration'
    source-url: github.com/jenkinsci/git-client-plugin/commit/75ea3fe05650fc6ca09046a72493e2b3f066fb98
    technology:
    - java
