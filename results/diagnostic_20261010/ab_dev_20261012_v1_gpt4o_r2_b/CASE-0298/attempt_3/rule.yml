rules:
- id: vuln-notesnook-e87f5e5f
  patterns:
  - pattern: <a href="${src}?ref_src=twsrc%5Etfw"></a>
  - pattern-not: 'const anchor = document.createElement("a");

      anchor.href = `${src}?ref_src=twsrc%5Etfw`;

      $... = anchor.outerHTML;'
  languages:
  - typescript
  message: Directly embedding user-controlled URLs into HTML can lead to security
    vulnerabilities such as XSS. Instead, create an anchor element and set its href
    attribute separately to ensure proper encoding and avoid script injection.
  severity: ERROR
  metadata:
    category: security
    cwe: CWE-79
    owasp: A7:2017-Cross-Site Scripting (XSS)
    source-url: github.com/streetwriters/notesnook/commit/e87f5e5f899f45df28d7c0f33f15e9178d1fbcb7
    technology:
    - typescript
