rules:
- id: vuln-apprise-e20fce63
  patterns:
  - pattern: r'/?(?P<events>([A-Z0-9_-]+/?)+)?'
  - pattern-not: r'((?P<events>(/[A-Z0-9_-]+)+))?'
  languages:
  - python
  message: The regex pattern allows for optional leading slashes, which can lead to
    incorrect parsing of event names. Ensure that event names are prefixed with a
    slash to avoid ambiguity and potential security issues.
