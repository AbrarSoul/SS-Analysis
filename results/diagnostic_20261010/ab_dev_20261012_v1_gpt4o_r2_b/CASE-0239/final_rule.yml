rules:
- id: vuln-hosted-git-info-29adfe5e
  patterns:
  - pattern: $VAR = $URL.match(new RegExp('^([^:]+):(?:(?:[^@:]+(?:[^@]+)?@)?([^/]*))[/](.+?)(?:[.]git)?($|#)'))
  - pattern-not: $VAR = $URL.match(/^([^:]+):(?:[^@]+@)?(?:([^/]*)\/)?([^#]+)/)
  languages:
  - javascript
  message: The use of an overly permissive regular expression in URL parsing can lead
    to security vulnerabilities. Ensure that the regular expression is correctly scoped
    to avoid unintended matches. Update the regex to the fixed version to prevent
    potential issues.
  severity: ERROR
  metadata:
    category: security
    cwe: CWE-20
    owasp: A6:2017-Security Misconfiguration
    source-url: github.com/npm/hosted-git-info/commit/29adfe5ef789784c861b2cdeb15051ec2ba651a7
    technology:
    - javascript
