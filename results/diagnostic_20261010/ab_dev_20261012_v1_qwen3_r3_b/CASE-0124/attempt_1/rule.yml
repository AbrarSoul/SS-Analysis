rules:
- id: vuln-sagemaker-python-sdk-2d873d53
  patterns:
  - pattern: os.system($CMD)
  - pattern-not: subprocess.run($CMD, check=True, capture_output=True)
  languages:
  - python
  message: Use of os.system() with string command construction is vulnerable to command
    injection. The patched code uses subprocess.run() with a list of arguments to
    prevent shell injection. Replace os.system() calls with subprocess.run() and pass
    commands as lists instead of strings.
  severity: ERROR
  metadata:
    category: security
    cwe: CWE-78
    owasp: A01:2021-Broken Access Control
    references:
    - https://docs.python.org/3/library/os.html#os.system
    - https://docs.python.org/3/library/subprocess.html#subprocess.run
    source-url: github.com/aws/sagemaker-python-sdk/commit/2d873d53f708ea570fc2e2a6974f8c3097fe9df5
    technology:
    - python
