rules:
- id: vuln-nocodb-079e3abe
  patterns:
  - pattern-either:
    - pattern: const data = Papaparse.unparse({ ... });
    - pattern: const data = Papaparse.unparse(...);
  - pattern-not: 'const data = Papaparse.unparse(..., { escapeFormulae: true });'
  languages:
  - typescript
  message: 'Missing escapeFormulae option in Papaparse.unparse() call. This vulnerability
    allows CSV formula injection attacks where malicious data entered into CSV cells
    can execute arbitrary commands when opened in spreadsheet applications like Excel
    or Google Sheets. The fix is to add { escapeFormulae: true } as the second argument
    to Papaparse.unparse().'
  severity: ERROR
  metadata:
    category: security
    cwe: CWE-1235
    owasp: OWASP-A03:2021
    source-url: github.com/nocodb/nocodb/commit/079e3abe98a054f5304592def7a0e8fdb9b06eee
    technology:
    - typescript
