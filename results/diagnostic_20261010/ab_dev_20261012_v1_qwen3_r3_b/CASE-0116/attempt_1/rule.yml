rules:
- id: vuln-thrift-0919c3d5
  patterns:
  - pattern: "socket.getSSLParameters();\n      socket.setSSLParameters(...)"
  - pattern-not: "socket.getSSLParameters();\n      SSLParameters sslParams = socket.getSSLParameters();\n\
      \      sslParams.setEndpointIdentificationAlgorithm(\"HTTPS\");\n      socket.setSSLParameters(sslParams);"
  languages:
  - java
  message: Missing endpoint identification algorithm configuration in SSL/TLS transport.
    This vulnerability allows for man-in-the-middle attacks by disabling hostname
    verification. The fix involves setting the endpoint identification algorithm to
    "HTTPS" using SSLParameters.setEndpointIdentificationAlgorithm().
  severity: ERROR
  metadata:
    category: security
    cwe: CWE-295
    owasp: OWASP-M01
    source-url: github.com/apache/thrift/commit/0919c3d5506151514e283a63e1fe1ce83e2449d8
    technology:
    - java
