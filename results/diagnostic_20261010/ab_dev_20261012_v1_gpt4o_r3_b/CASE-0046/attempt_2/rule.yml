rules:
- id: vuln-quark-auto-save-ea8377a5
  patterns:
  - pattern: 'if $KEY not in $BLACKLIST:'
  - pattern-not: 'if $KEY in $WHITELIST:'
  languages:
  - python
  message: Detected potential mass assignment vulnerability by using a blacklist approach.
