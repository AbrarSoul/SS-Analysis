rules:
- id: vuln-ws-scrcpy-e83cf654
  pattern: "if ($VAR.indexOf($PUBLIC_DIR) === -1) {\n  ...\n}\n"
  pattern-not: "if ($VAR.indexOf($PUBLIC_DIR) !== 0) {\n  ...\n}\n"
  languages:
  - typescript
  message: '"Potential directory traversal vulnerability detected. The code checks
    if a path does not contain a directory using indexOf with -1, which can be bypassed.
    Ensure the path starts with the expected directory using indexOf with 0 to prevent
    unauthorized access."

    '
  severity: ERROR
  metadata:
    source-url: github.com/netristv/ws-scrcpy/commit/e83cf65438bef83a3503b25358bba97bcc156fef
    category: security
    cwe:
    - CWE-22
    owasp:
    - A5:2017-Broken Access Control
    references:
    - https://owasp.org/www-community/attacks/Path_Traversal
    technology:
    - typescript
