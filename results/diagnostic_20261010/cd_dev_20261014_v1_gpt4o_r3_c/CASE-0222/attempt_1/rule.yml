rules:
- id: vuln-mindsdb-083afcf6
  pattern: requests.post($URL, headers=$HEADERS, data=$DATA, verify=False)
  pattern-not: requests.post($URL, headers=$HEADERS, data=$DATA, verify=True)
  languages:
  - python
  message: Detected use of requests.post with 'verify=False'. This disables SSL certificate
    verification, which can lead to man-in-the-middle attacks. Ensure 'verify' is
    set to True or use a valid CA bundle.
  severity: ERROR
  metadata:
    source-url: github.com/mindsdb/mindsdb/commit/083afcf6567cf51aa7d89ea892fd97689919053b
    category: security
    cwe: CWE-295
    owasp: A6:2017-Security Misconfiguration
    references:
    - https://docs.python-requests.org/en/master/user/advanced/#ssl-cert-verification
    technology: python
