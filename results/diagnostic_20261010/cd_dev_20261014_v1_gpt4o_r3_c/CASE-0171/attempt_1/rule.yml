rules:
- id: vuln-graphhopper-eb189be1
  pattern: '$URL = $URL.replaceFirst("/navigate/directions/v5/gh/" + $PROFILE + "/",
    "");

    $URL = $URL.replaceAll("\\?[*]", "");

    '
  pattern-not: 'String $URL_START = "/navigate/directions/v5/gh/" + $PROFILE + "/";

    if (!$URL.startsWith($URL_START)) throw new IllegalArgumentException("Incorrect
    URL " + $URL);

    $URL = $URL.substring($URL_START.length());

    '
  languages:
  - java
  message: Potential URL manipulation vulnerability. Ensure URL starts with the expected
    prefix and handle it safely to prevent incorrect URL processing.
  severity: ERROR
  metadata:
    source-url: github.com/graphhopper/graphhopper/commit/eb189be1fa7443ebf4ae881e737a18f818c95f41
    category: security
    cwe: CWE-20
    owasp: A5:2017-Broken Access Control
    references:
    - https://cwe.mitre.org/data/definitions/20.html
    technology: java
