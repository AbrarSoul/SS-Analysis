rules:
- id: vuln-ckeditor-oembed-plugin-10f6169e
  pattern: div(embeddedContent,oembed-provider-*) script
  languages:
  - javascript
  message: Potential XSS vulnerability in CKEditor oEmbed plugin. The pattern 'div(embeddedContent,oembed-provider-*)
    script' allows arbitrary script execution by permitting all attributes on script
    tags within embedded content. This can lead to cross-site scripting attacks where
    malicious scripts are injected into the page. Fix by removing or restricting attribute
    permissions on script tags in embedded content.
  severity: ERROR
  metadata:
    category: security
    cwe: CWE-79
    owasp: OWASP-A03:2021
    source-url: github.com/w8tcha/CKEditor-oEmbed-Plugin/commit/10f6169e39510bbf5af913886037044458b9dc9b
    technology:
    - javascript
