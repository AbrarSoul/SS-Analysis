rules:
- id: ckeditor-oembed-plugin-xss
  patterns:
  - pattern: div(embeddedContent,oembed-provider-*) script
  - pattern-not: 'div(embeddedContent,oembed-provider-*) script { attributes: ''*''
      }'
  languages:
  - javascript
  message: Potential XSS vulnerability in CKEditor oEmbed plugin. The pattern allows
    arbitrary script execution by permitting all attributes on embedded content scripts.
    This could enable attackers to inject malicious JavaScript into the page. Fix
    by removing or restricting attribute wildcards in script tag configurations.
  severity: ERROR
  metadata:
    category: security
    cwe: CWE-79
    owasp: OWASP Top 10:2021 - A03:2021 - Injection
    source-url: github.com/w8tcha/CKEditor-oEmbed-Plugin/commit/10f6169e39510bbf5af913886037044458b9dc9b
    technology:
    - javascript
