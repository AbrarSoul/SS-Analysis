rules:
- id: vuln-ckeditor-oembed-plugin-10f6169e
  patterns:
  - pattern-either:
    - pattern: '''div(embeddedContent,oembed-provider-*) script'': { attributes: ''*''
        }'
    - pattern: '"div(embeddedContent,oembed-provider-*) script": { attributes: ''*''
        }'
  - pattern-not: '''div(embeddedContent,oembed-provider-*) script'': { attributes:
      { ''src'': $SRC } }'
  - pattern-not: '"div(embeddedContent,oembed-provider-*) script": { attributes: {
      ''src'': $SRC } }'
  languages:
  - javascript
  message: Potential security vulnerability in CKEditor oEmbed plugin. The pattern
    allows all attributes on script elements within embedded content, which could
    enable XSS attacks by permitting malicious script execution. Fix by restricting
    allowed attributes or validating script sources.
  severity: ERROR
  metadata:
    category: security
    cwe: CWE-79
    owasp: OWASP-A03:2021
    source-url: github.com/w8tcha/CKEditor-oEmbed-Plugin/commit/10f6169e39510bbf5af913886037044458b9dc9b
    technology:
    - javascript
