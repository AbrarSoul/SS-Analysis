rules:
- id: vuln-jspdf-d8bb3b39
  patterns:
  - pattern: var extractedInfo = /^data:(\w*\/\w*);*(charset=[\w=-]*)*;*$/.exec($VAR)
  - pattern-not: var extractedInfo = /^data:(\w*\/\w*);*(charset=(?!charset=)[\w=-]*)*;*$/.exec($VAR)
  languages:
  - javascript
  message: Vulnerable regex pattern for data URI parsing allows malicious charset
    injection. The regex does not properly prevent 'charset=' from appearing in the
    charset parameter, enabling potential bypass of security checks. Fix by adding
    negative lookahead (?!charset=) to prevent charset parameter from containing 'charset='.
    This vulnerability could allow attackers to inject malicious content or bypass
    validation.
  severity: ERROR
  metadata:
    category: security
    cwe: CWE-20
    owasp: OWASP-A03:2021
    source-url: github.com/MrRio/jsPDF/commit/d8bb3b39efcd129994f7a3b01b632164144ec43e
    technology:
    - javascript
