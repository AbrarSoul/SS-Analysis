rules:
- id: vuln-agentscope-7d285e86
  pattern: "if not $FILENAME.endswith(\".json\"):\n    return jsonify({\"error\":\
    \ \"Only JSON files can be deleted\"})\n$FILENAME = os.path.basename($FILENAME)\n"
  pattern-not: "if not $FILENAME.endswith(\".json\"):\n    return jsonify({\"error\"\
    : \"Only JSON files can be deleted\"})\n$FILENAME = os.path.basename($FILENAME)\n"
  languages:
  - python
  message: Potential path traversal vulnerability detected. The code checks if filename
    ends with '.json' but does not properly sanitize the filename before using it.
    An attacker could potentially bypass this check by providing a malicious filename
    that includes directory traversal sequences. Fix by ensuring proper input validation
    and sanitization of filenames, especially when they are used in file operations.
  severity: ERROR
  metadata:
    source-url: github.com/modelscope/agentscope/commit/7d285e862f86fa1d96ed04c4cd40a5f1b8f9189a
    category: security
    cwe: CWE-22
    owasp: A01:2021-Broken Access Control
    references:
    - https://owasp.org/www-community/attacks/Path_Traversal
    - https://cwe.mitre.org/data/definitions/22.html
    technology: python
