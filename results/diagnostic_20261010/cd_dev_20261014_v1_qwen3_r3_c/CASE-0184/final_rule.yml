rules:
- id: vuln-git-client-plugin-75ea3fe0
  pattern: File.createTempFile($PREFIX, $SUFFIX, $WORKSPACE)
  pattern-not: 'File.createTempFile($PREFIX, $SUFFIX)

    File.createTempFile($PREFIX, $SUFFIX, $WORKSPACE)

    File.createTempFile($PREFIX, $SUFFIX, $WORKSPACE).toFile()

    '
  languages:
  - java
  message: Use of File.createTempFile with explicit workspace parameter may create
    world-readable temporary files on Unix-like systems. The fix ensures that temporary
    files are created with restrictive permissions (rw-------) on non-Windows platforms.
    Replace calls to File.createTempFile() with custom helper methods that enforce
    secure file permissions.
  severity: ERROR
  metadata:
    source-url: github.com/jenkinsci/git-client-plugin/commit/75ea3fe05650fc6ca09046a72493e2b3f066fb98
    category: security
    cwe:
    - CWE-732
    owasp:
    - OWASP-A03:2021
    references:
    - https://owasp.org/www-project-top-ten/OWASP_Top_Ten_2021/Top_10_A03_2021-Injection
    - https://docs.oracle.com/javase/8/docs/api/java/io/File.html#createTempFile-java.lang.String-java.lang.String-java.io.File-
    technology:
    - java
