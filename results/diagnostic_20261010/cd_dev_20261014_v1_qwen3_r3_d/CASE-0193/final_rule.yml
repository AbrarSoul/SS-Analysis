rules:
- id: vuln-semantic-versioning-plugin-8df2fabd
  patterns:
  - pattern: DocumentBuilderFactory.newInstance().newDocumentBuilder()
  - pattern-not: DocumentBuilderFactory.newInstance().setAttribute(XMLConstants.ACCESS_EXTERNAL_DTD,
      "").setAttribute(XMLConstants.ACCESS_EXTERNAL_SCHEMA, "").newDocumentBuilder()
  languages:
  - java
  message: Insecure XML processing vulnerability. The code creates a DocumentBuilder
    without setting ACCESS_EXTERNAL_DTD and ACCESS_EXTERNAL_SCHEMA attributes to empty
    strings, which can lead to XXE (XML External Entity) attacks. Fix by explicitly
    setting these attributes to empty strings to disable external entity resolution.
  severity: ERROR
  metadata:
    category: security
    cwe: CWE-611
    owasp: OWASP-A04:2021
    source-url: github.com/jenkinsci/semantic-versioning-plugin/commit/8df2fabd7d7396ae29c374914d1357744d3e454f
    technology:
    - java
