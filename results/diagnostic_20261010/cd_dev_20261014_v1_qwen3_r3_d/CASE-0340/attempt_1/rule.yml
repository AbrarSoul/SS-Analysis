rules:
- id: vuln-logkitty-ef2f673e
  patterns:
  - pattern-either:
    - pattern: execSync(`${...} ...`)
    - pattern: execSync('...' + ...)
    - pattern: execSync(`...${...}...`)
  - pattern-not: execFileSync(..., [...])
  - pattern-not: execFileSync(..., ["..."])
  languages:
  - typescript
  message: Use of execSync with string concatenation creates potential command injection
    vulnerability. The vulnerable code constructs shell commands by concatenating
    user-provided variables directly into the command string, which can allow attackers
    to inject malicious commands. The fix uses execFileSync with an array of arguments
    instead, which properly separates command arguments and prevents shell injection.
    This pattern should be replaced throughout the codebase to prevent similar vulnerabilities.
  severity: ERROR
  metadata:
    category: security
    cwe: '78'
    owasp: OWASP Top 10:2021 - A03:2021 - Injection
    source-url: github.com/zamotany/logkitty/commit/ef2f673e25c629544dd3de6429999318447dd6bf
    technology:
    - typescript
