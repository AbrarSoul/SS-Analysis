rules:
- id: vuln-notesnook-e87f5e5f
  pattern: '`${$SRC}?ref_src=twsrc%5Etfw`

    '
  pattern-not: '`${$SRC}?ref_src=twsrc%5Etfw` + $REST

    '
  languages:
  - typescript
  message: Potential XSS vulnerability in embed component. The URL parameter is directly
    concatenated into HTML without proper sanitization. This could allow attackers
    to inject malicious scripts. Fix by creating a proper DOM element and using outerHTML
    instead of direct string concatenation.
  severity: ERROR
  metadata:
    source-url: github.com/streetwriters/notesnook/commit/e87f5e5f899f45df28d7c0f33f15e9178d1fbcb7
    category: security
    cwe:
    - 79
    owasp:
    - A07:2021 - Identification and Authentication Failures
    technology:
    - typescript
    references:
    - https://owasp.org/www-community/attacks/xss/
    - https://developer.mozilla.org/en-US/docs/Web/API/Element/outerHTML
