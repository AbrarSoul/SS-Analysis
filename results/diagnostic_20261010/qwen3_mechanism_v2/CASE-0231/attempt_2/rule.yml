rules:
- id: vuln-agentscope-7d285e86
  pattern-either:
  - patterns:
    - pattern: "if $COND:\n    ...\n    $FUNC($FILENAME)\n"
    - pattern-not: "if not $FILENAME.endswith(\".json\"):\n    return jsonify({\"\
        error\": \"Only JSON files can be deleted\"})\n"
    - pattern-inside: "def $FUNC(...):\n    ...\n"
  - patterns:
    - pattern: '$FUNC($FILENAME)

        '
    - pattern-not: "if not $FILENAME.endswith(\".json\"):\n    return jsonify({\"\
        error\": \"Only JSON files can be deleted\"})\n"
    - pattern-inside: "def $FUNC(...):\n    ...\n"
  languages:
  - python
  message: Potential directory traversal vulnerability detected. The filename parameter
    is not validated to ensure it's a JSON file before processing, which could allow
    attackers to delete arbitrary files. Add validation to ensure only .json files
    are processed.
  severity: ERROR
  metadata:
    source-url: github.com/modelscope/agentscope/commit/7d285e862f86fa1d96ed04c4cd40a5f1b8f9189a
    category: security
    cwe:
