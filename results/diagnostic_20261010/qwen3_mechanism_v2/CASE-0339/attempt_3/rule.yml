rules:
- id: vuln-trilium-4c3fcc3e
  pattern: $RESULT.HIGHLIGHTEDNOTEPATHTITLE = $RESULT.NOTEPTHTITLE.replace(/[$VAR]/g,
    '');
  pattern-not: $RESULT.HIGHLIGHTEDNOTEPATHTITLE = $RESULT.NOTEPTHTITLE.replace(/[<{}]/g,
    '');
