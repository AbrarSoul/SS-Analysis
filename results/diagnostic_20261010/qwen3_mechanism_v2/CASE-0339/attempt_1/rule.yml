rules:
- id: vuln-trilium-4c3fcc3e
  pattern: $RESULT.HIGHLIGHTEDNOTEPTITLE = $RESULT.NOTEPATHTITLE.replace(/[<{}]/g,
    '')
  pattern-not: $RESULT.HIGHLIGHTEDNOTEPTITLE = $RESULT.NOTEPATHTITLE.replace(/[<{}]/g,
    '')
  languages:
  - javascript
  message: Potential insecure regex replacement vulnerability. The regex pattern /[<{}]/g
    may not properly escape special regex characters, leading to unexpected behavior
    or potential injection vulnerabilities. Ensure proper escaping of regex metacharacters
    in user-controlled data.
  severity: WARNING
  metadata:
    source-url: github.com/zadam/trilium/commit/4c3fcc3ea6f37debcb87ac1a7f5698c27be0e67b
    category: security
    cwe: CWE-117
    technology:
    - javascript
