rules:
- id: vuln-ckeditor-oembed-plugin-10f6169e
  pattern: "$CONFIG['div(embeddedContent,oembed-provider-*) script']: {\n    attributes:\
    \ '*'\n}\n"
  pattern-not: "$CONFIG['div(embeddedContent,oembed-provider-*) script']: {\n    attributes:\
    \ $ATTRS\n}\n"
  languages:
  - javascript
  message: Unsafe attribute handling in CKEditor oEmbed plugin allows arbitrary script
    execution. The configuration permits all attributes ('*') on embedded content
    scripts, which can lead to XSS vulnerabilities when untrusted data is processed.
    Fix by explicitly defining allowed attributes or sanitizing input before processing.
  severity: ERROR
  metadata:
    source-url: github.com/w8tcha/CKEditor-oEmbed-Plugin/commit/10f6169e39510bbf5af913886037044458b9dc9b
    category: security
    cwe:
    - CWE-79
    technology:
    - javascript
