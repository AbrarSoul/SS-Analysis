rules:
- id: vuln-thrift-0919c3d5
  pattern-either:
  - patterns:
    - pattern: $SOCKET.getSSLParameters()
    - pattern: $SOCKET.setSSLParameters($PARAMS)
    - pattern-not: $SOCKET.setSSLParameters($PARAMS)
      pattern-not-inside: '$SOCKET.setSSLParameters($PARAMS);

        $PARAMS.setEndpointIdentificationAlgorithm("HTTPS");

        '
  - patterns:
    - pattern: $SOCKET.getSSLParameters()
    - pattern: $SOCKET.setSSLParameters($PARAMS)
    - pattern-not: $SOCKET.setSSLParameters($PARAMS)
      pattern-not-inside: '$SOCKET.setSSLParameters($PARAMS);

        $PARAMS.setEndpointIdentificationAlgorithm("HTTPS");

        '
  languages:
  - java
  message: Missing SSL endpoint identification algorithm configuration. The code retrieves
    SSL parameters but does not set the 'HTTPS' endpoint identification algorithm,
    which can lead to man-in-the-middle attacks by allowing connections to unverified
    hosts.
  severity: ERROR
  metadata:
    source-url: github.com/apache/thrift/commit/0919c3d5506151514e283a63e1fe1ce83e2449d8
    category: security
    cwe:
    - CWE-295
    technology:
    - java
