rules:
- id: vuln-logkitty-ef2f673e
  patterns:
  - pattern: execSync(...)
  - pattern: spawn(...)
  pattern-not: execFileSync(...)
  message: Use of execSync() can lead to command injection vulnerabilities. Replace
    with execFileSync() to avoid potential security risks from untrusted input in
    command arguments.
  languages:
  - typescript
  severity: ERROR
  metadata:
    source-url: github.com/zamotany/logkitty/commit/ef2f673e25c629544dd3de6429999318447dd6bf
    category: security
    cwe:
    - CWE-78
    technology:
    - typescript
