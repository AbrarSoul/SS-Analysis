rules:
- id: vuln-git-client-plugin-75ea3fe0
  pattern-either:
  - patterns:
    - pattern: File.createTempFile($PREFIX, $SUFFIX)
    - pattern-not: File.createTempFile($PREFIX, $SUFFIX, $DIR)
    - pattern-not: Files.createTempFile($PATH, $PREFIX, $SUFFIX)
    - pattern-not: Files.createTempFile($PATH, $PREFIX, $SUFFIX, $ATTR)
  - patterns:
    - pattern: File.createTempFile($PREFIX, $SUFFIX, $DIR)
    - pattern-not: File.createTempFile($PREFIX, $SUFFIX, $DIR)
    - pattern-not: Files.createTempFile($PATH, $PREFIX, $SUFFIX)
    - pattern-not: Files.createTempFile($PATH, $PREFIX, $SUFFIX, $ATTR)
  languages:
  - java
  message: Use of File.createTempFile without proper file permissions can lead to
    insecure temporary files. The patch ensures that temporary files are created with
    restricted permissions (rw-------) on non-Windows systems to prevent unauthorized
    access. Replace direct calls to File.createTempFile with a helper method that
    sets appropriate file attributes.
  severity: ERROR
  metadata:
    source-url: github.com/jenkinsci/git-client-plugin/commit/75ea3fe05650fc6ca09046a72493e2b3f066fb98
    category: security
    cwe:
    - CWE-377
    technology:
    - java
