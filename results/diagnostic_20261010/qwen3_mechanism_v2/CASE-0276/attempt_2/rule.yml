rules:
- id: vuln-cpython-482d6f8b
  pattern-either:
  - pattern: 'isinstance($SELF, (SourceLoader, ExtensionFileLoader))

      '
  - pattern: 'isinstance($SELF, (SourceLoader, SourcelessFileLoader, ExtensionFileLoader))

      '
  pattern-not: 'isinstance($SELF, (SourceLoader, SourcelessFileLoader, ExtensionFileLoader))

    '
  pattern-inside: "def $FUNC(...):\n    ...\n"
  languages:
  - python
  message: Incomplete isinstance check in importlib loader logic. The vulnerability
    occurs when SourcelessFileLoader is not included in the isinstance check, potentially
    allowing unsafe code execution through malicious module loading. Fix by including
    SourcelessFileLoader in the isinstance check as shown in the patch.
  severity: ERROR
  metadata:
    source-url: github.com/python/cpython/commit/482d6f8bdba9da3725d272e8bb4a2d25fb6a603e
    category: security
    cwe:
    - CWE-94
    technology:
    - python
