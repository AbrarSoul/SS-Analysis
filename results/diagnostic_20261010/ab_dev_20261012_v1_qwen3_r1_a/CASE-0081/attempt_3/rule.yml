rules:
- id: vuln-ebay-mcp-aab0bda7
  pattern: "import { readFileSync, writeFileSync, existsSync } from 'fs';\n...\nlet\
    \ $ENVCONTENT = existsSync($PATH) ? readFileSync($PATH, 'utf-8') : '';\n...\n\
    for (const [$KEY, $VALUE] of Object.entries($UPDATES)) {\n    const $REGEX = new\
    \ RegExp(`^(#\\\\s*)?${$KEY}=.*$`, 'gm');\n    const $NEWLINE = `${$KEY}=\"${$VALUE}\"\
    `;\n    if ($REGEX.test($ENVCONTENT)) {\n        $ENVCONTENT = $ENVCONTENT.replace($REGEX,\
    \ $NEWLINE);\n    } else {\n        $ENVCONTENT += `\\n${$NEWLINE}`;\n    }\n\
    }\n...\nwriteFileSync($PATH, $ENVCONTENT, 'utf-8');\n"
  pattern-not: 'import dotenv from ''dotenv'';

    import stringify from ''dotenv-stringify'';

    ...

    const existingEnv = existsSync($PATH) ? dotenv.parse(readFileSync($PATH, ''utf-8''))
    : {};

    ...

    const mergedEnv = { ...existingEnv, ...$UPDATES };

    ...

    const safeEnvContent = stringify(mergedEnv);

    ...

    writeFileSync($PATH, safeEnvContent, ''utf-8'');

    '
  languages:
  - typescript
  message: Vulnerable .env file update pattern detected. The code directly manipulates
    environment variable content using regex replacement which can lead to injection
    vulnerabilities and improper handling of special characters. This approach is
    dangerous because it doesn't properly escape values and can be exploited for command
    injection or configuration manipulation. Fix by using a proper dotenv parsing
    and stringifying library like 'dotenv-stringify' to safely handle environment
    variables.
  severity: ERROR
  metadata:
    source-url: github.com/YosefHayim/ebay-mcp/commit/aab0bda75ea9dd27aa37d0d8524d7cf41b3c4a9a
    category: security
    cwe:
    - CWE-77
    owasp:
    - OWASP Top 10:2021 - A03:2021 - Injection
    references:
    - https://owasp.org/www-project-top-ten/OWASP_Top_Ten_2021/Top_10_A03_2021-Injection
    technology:
    - typescript
