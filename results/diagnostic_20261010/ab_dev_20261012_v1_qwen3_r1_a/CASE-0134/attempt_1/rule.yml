rules:
- id: vuln-apprise-e20fce63
  pattern: 'r''/?(?P<events>([A-Z0-9_-]+/?)+)?''

    '
  pattern-not: "r'((?P<events>(/[A-Z0-9_-]+)+))?'  \n"
