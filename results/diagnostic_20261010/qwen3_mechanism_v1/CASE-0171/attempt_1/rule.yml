rules:
- id: vuln-graphhopper-eb189be1
  patterns:
  - pattern: '$url = $url.replaceFirst(...);

      $url = $url.replaceAll(...);

      '
  - pattern: '$url = $url.replaceFirst(...);

      $url = $url.replace(...);

      '
  - pattern: '$url = $url.replaceAll(...);

      $url = $url.replace(...);

      '
  pattern-not: 'if (!$url.startsWith(...)) throw new IllegalArgumentException(...);

    $url = $url.substring(...);

    '
  pattern-not-inside: 'if (!$url.startsWith(...)) throw new IllegalArgumentException(...);

    ...

    '
  message: 'Unsafe URL handling vulnerability: untrusted input is modified using regex-based
    replace operations without prior validation, potentially allowing path traversal
    or injection attacks. The fix requires validating that the URL starts with the
    expected prefix before processing.'
  severity: ERROR
  languages:
  - java
  metadata:
    source-url: github.com/graphhopper/graphhopper/commit/eb189be1fa7443ebf4ae881e737a18f818c95f41
    category: security
    cwe:
    - CWE-20
    technology:
    - java
  fix: 'String urlStart = "/navigate/directions/v5/gh/" + profile + "/";

    if (!url.startsWith(urlStart)) throw new IllegalArgumentException("Incorrect URL
    " + url);

    url = url.substring(urlStart.length());'
