rules:
- id: vuln-graphhopper-eb189be1
  patterns:
  - pattern: $URL = $URL.replaceFirst(...);
  - pattern: $URL = $URL.replaceAll("...", "");
  - pattern-not: if (!$URL.startsWith(...)) throw new IllegalArgumentException(...);
  - pattern-not: String $VAR = "..."; if (!$URL.startsWith($VAR)) throw new IllegalArgumentException(...);
  pattern-inside: "void $FUNC(...) {\n  ...\n}\n"
  message: Potential insecure URL handling vulnerability. The code directly processes
    user-provided URLs with replaceFirst/replaceAll without validating the URL prefix,
    which could allow arbitrary URL manipulation and lead to unauthorized access or
    path traversal attacks. Fix by validating that the URL starts with the expected
    prefix before processing.
  severity: ERROR
  languages:
  - java
  metadata:
    source-url: github.com/graphhopper/graphhopper/commit/eb189be1fa7443ebf4ae881e737a18f818c95f41
    category: security
    cwe:
    - CWE-22
    technology:
    - java
