rules:
- id: vuln-graphhopper-eb189be1
  patterns:
  - pattern: $url = $url.replaceFirst(...);
  - pattern: $url = $url.replaceAll(...);
  pattern-not: "{\n  \"pattern\": \"if (!$url.startsWith(...)) throw new IllegalArgumentException(...);\"\
    ,\n  \"language\": \"java\"\n}\n"
  pattern-not-inside: "{\n  \"pattern\": \"if (!$url.startsWith(...)) throw new IllegalArgumentException(...);\
    \ ...\",\n  \"language\": \"java\"\n}\n"
  message: Unsafe URL handling detected. The code directly processes user-provided
    URL without validating its prefix, which could allow arbitrary path traversal
    or injection attacks. Fix by validating the URL starts with expected prefix before
    processing.
  severity: ERROR
  languages:
  - java
  metadata:
    source-url: github.com/graphhopper/graphhopper/commit/eb189be1fa7443ebf4ae881e737a18f818c95f41
    category: security
    cwe:
    - CWE-22
    technology:
    - java
