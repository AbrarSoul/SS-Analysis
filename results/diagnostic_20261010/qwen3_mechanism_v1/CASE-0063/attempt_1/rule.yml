rules:
- id: vuln-jspdf-d8bb3b39
  patterns:
  - pattern: /^data:(\w*\/\w*);*(charset=[\w=-]*)*;*$/.exec($X)
  - pattern-not: /^data:(\w*\/\w*);*(charset=(?!charset=)[\w=-]*)*;*$/.exec($X)
  message: Potential Regular Expression Denial of Service (ReDoS) vulnerability in
    data URI parsing. The regex pattern allows for catastrophic backtracking when
    processing maliciously crafted data URIs with charset parameters, potentially
    leading to denial of service. Fix by adding a negative lookahead assertion to
    prevent matching charset= within the charset parameter.
  languages:
  - javascript
  severity: ERROR
  metadata:
    source-url: github.com/MrRio/jsPDF/commit/d8bb3b39efcd129994f7a3b01b632164144ec43e
    category: security
    cwe:
    - CWE-400
    technology:
    - javascript
