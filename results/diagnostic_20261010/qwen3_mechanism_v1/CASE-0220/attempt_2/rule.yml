rules:
- id: vuln-phpldapadmin-dd6e9583
  patterns:
  - pattern: http_request.setRequestHeader("Content-length", $PARAMETERS.length)
  - pattern: http_request.setRequestHeader("Connection", "close")
  message: Potential insecure HTTP request header manipulation vulnerability. The
    code sets 'Content-length' and 'Connection' headers which could allow attackers
    to manipulate the request flow or bypass security controls. These headers should
    be validated or removed to prevent potential injection attacks.
  severity: ERROR
  languages:
  - javascript
  pattern-not:
  - pattern: http_request.setRequestHeader("Content-length", parameters.length)
  - pattern: http_request.setRequestHeader("Connection", "close")
  metadata:
    source-url: github.com/mhuertos/phpLDAPadmin/commit/dd6e9583a2eb2ca085583765e8a63df5904cb036
    category: security
    cwe:
    - CWE-113
    technology:
    - javascript
