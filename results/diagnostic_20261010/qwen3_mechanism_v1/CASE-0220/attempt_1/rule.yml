rules:
- id: vuln-phpldapadmin-dd6e9583
  patterns:
  - pattern: http_request.setRequestHeader("Content-length", $PARAMETERS.length)
  - pattern: http_request.setRequestHeader("Connection", "close")
  message: Potential insecure HTTP header manipulation vulnerability. The code sets
    'Content-length' and 'Connection' headers directly from user-provided parameters,
    which could allow attackers to manipulate request headers and potentially bypass
    security controls or cause unexpected behavior in the HTTP request processing.
  severity: ERROR
  languages:
  - javascript
  pattern-not:
  - pattern: http_request.setRequestHeader("Content-length", parameters.length)
  - pattern: http_request.setRequestHeader("Connection", "close")
  metadata:
    source-url: github.com/mhuertos/phpLDAPadmin/commit/dd6e9583a2eb2ca085583765e8a63df5904cb036
    category: security
    cwe:
    - CWE-113
    technology:
    - javascript
