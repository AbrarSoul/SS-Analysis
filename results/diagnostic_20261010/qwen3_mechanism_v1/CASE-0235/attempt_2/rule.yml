rules:
- id: vuln-ws-scrcpy-e83cf654
  patterns:
  - pattern: "if ($X.indexOf($Y) !== 0) {\n  ...\n}\n"
  - pattern-not: "if ($X.indexOf($Y) !== 0) {\n    $RES.statusCode = 403;\n    $RES.end();\n\
      \    return;\n}\n"
  pattern-inside: "function $FUNC(...) {\n  ...\n  $REQ.url = $URL;\n  ...\n}\n"
  message: Path traversal vulnerability detected. The code checks if a pathname is
    within a public directory but does not properly validate the path before serving
    files, allowing attackers to access arbitrary files on the server. Add proper
    validation and return 403 status when path is outside allowed directory.
  severity: ERROR
  languages:
  - typescript
  metadata:
    source-url: github.com/netristv/ws-scrcpy/commit/e83cf65438bef83a3503b25358bba97bcc156fef
    category: security
    cwe:
    - CWE-22
    technology:
    - typescript
