rules:
- id: vuln-cpython-482d6f8b
  patterns:
  - pattern: isinstance($SELF, (SourceLoader, ExtensionFileLoader))
  - pattern-not: isinstance($SELF, (SourceLoader, SourcelessFileLoader, ExtensionFileLoader))
  message: Missing SourcelessFileLoader in isinstance check. This could allow unauthorized
    code execution by bypassing security checks that should apply to all file loaders
    including sourceless ones.
