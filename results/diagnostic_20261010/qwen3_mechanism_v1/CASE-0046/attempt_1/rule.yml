rules:
- id: vuln-quark-auto-save-ea8377a5
  patterns:
  - pattern: "for key in $VAR:\n    if key not in $LIST:\n        ...\n"
  - pattern: "for key in $VAR:\n    if key not in $LIST:\n        ...\n"
  pattern-not: "for key in $VAR:\n    if key in $ALLOWED_LIST:\n        ...\n"
  message: 'Potential batch assignment attack vulnerability: untrusted input is checked
    against a blacklist instead of a whitelist. This allows attackers to bypass restrictions
    by using keys not in the blacklist. Use an allowlist approach to prevent unauthorized
    assignments.'
  severity: ERROR
  languages:
  - python
  metadata:
    source-url: github.com/Cp0204/quark-auto-save/commit/ea8377a596446291953dbe36e2d119d85bcd865b
    category: security
    cwe:
    - CWE-20
    technology:
    - python
  pattern-inside: "def $FUNC(...):\n    ...\n    for key in $VAR:\n        if key\
    \ not in $LIST:\n            ...\n    ..."
