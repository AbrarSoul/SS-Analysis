rules:
- id: vuln-java-merge-sort-450fdee7
  patterns:
  - pattern: File.createTempFile($PREFIX, $SUFFIX)
  - pattern-not: Files.createTempFile($PREFIX, $SUFFIX).toFile()
  message: Use of File.createTempFile() instead of Files.createTempFile() with .toFile()
    can lead to insecure temporary file creation. The newer Files.createTempFile()
    method provides better security guarantees by ensuring the temporary file is created
    atomically and with appropriate permissions. Replace File.createTempFile() with
    Files.createTempFile().toFile().
  severity: ERROR
  languages:
  - java
  metadata:
    source-url: github.com/cowtowncoder/java-merge-sort/commit/450fdee70b5f181c2afc5d817f293efa1a543902
    category: security
    cwe:
    - CWE-377
    technology:
    - java
