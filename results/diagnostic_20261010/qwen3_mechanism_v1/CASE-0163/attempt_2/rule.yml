rules:
- id: vuln-git-pull-or-clone-f9ce092b
  patterns:
  - pattern: const args = ["clone", ..., url, outPath]
  - pattern-not: const args = ["clone", ..., "--", url, outPath]
  message: Missing '--' separator in git clone command arguments. This can lead to
    argument injection vulnerabilities where untrusted URL input is interpreted as
    a git clone flag instead of a repository URL. Add '--' before the URL to properly
    separate options from the repository path.
  severity: ERROR
  languages:
  - javascript
  metadata:
    source-url: github.com/feross/git-pull-or-clone/commit/f9ce092be13cc32e685dfa26e7705e9c6e3108a3
    category: security
    cwe:
    - CWE-15
    technology:
    - javascript
  pattern-inside: "function $FUNC(...) {\n  ...\n  const args = [...]\n  ...\n}"
