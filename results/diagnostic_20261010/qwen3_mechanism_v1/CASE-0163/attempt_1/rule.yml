rules:
- id: vuln-git-pull-or-clone-f9ce092b
  patterns:
  - pattern: const $ARGS = [..., $URL, $OUTPATH]
  - pattern-either:
    - pattern: $CHILD_PROCESS.spawn("git", $ARGS, ...)
    - pattern: $CHILD_PROCESS.execFile("git", $ARGS, ...)
    - pattern: $CHILD_PROCESS.exec("git $ARGS", ...)
  - pattern-not: const $ARGS = [..., "--", $URL, $OUTPATH]
  message: Missing '--' separator in git clone command arguments. This can lead to
    argument injection vulnerabilities where untrusted URL input is interpreted as
    additional git flags instead of the repository URL. Fix by adding '--' before
    the URL to separate git options from repository arguments.
  severity: ERROR
  languages:
  - javascript
  metadata:
    source-url: github.com/feross/git-pull-or-clone/commit/f9ce092be13cc32e685dfa26e7705e9c6e3108a3
    category: security
    cwe:
    - CWE-15
    technology:
    - javascript
