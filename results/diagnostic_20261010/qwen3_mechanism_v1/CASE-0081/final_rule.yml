rules:
- id: vuln-ebay-mcp-aab0bda7
  patterns:
  - pattern: "import { readFileSync, writeFileSync } from 'fs';\n...\nlet envContent\
      \ = existsSync(envPath) ? readFileSync(envPath, 'utf-8') : '';\n...\nfor (const\
      \ [key, value] of Object.entries($UPDATES)) {\n  ...\n  const regex = new RegExp(`^(#\\\
      \\s*)?${key}=.*$`, 'gm');\n  ...\n  if (regex.test(envContent)) {\n    envContent\
      \ = envContent.replace(regex, $NEWLINE);\n  } else {\n    envContent += `\\\
      n${$NEWLINE}`;\n  }\n}\n...\nwriteFileSync($PATH, envContent, 'utf-8');\n"
  - pattern: "import { readFileSync, writeFileSync } from 'fs';\n...\nlet envContent\
      \ = existsSync(envPath) ? readFileSync(envPath, 'utf-8') : '';\n...\nfor (const\
      \ [key, value] of Object.entries($UPDATES)) {\n  ...\n  const regex = new RegExp(`^(#\\\
      \\s*)?${key}=.*$`, 'gm');\n  ...\n  if (regex.test(envContent)) {\n    envContent\
      \ = envContent.replace(regex, $NEWLINE);\n  } else {\n    envContent += `\\\
      n${$NEWLINE}`;\n  }\n}\n...\nwriteFileSync($PATH, envContent, 'utf-8');\n"
  pattern-not: 'import dotenv from ''dotenv'';

    import stringify from ''dotenv-stringify'';

    ...

    const existingEnv = existsSync(envPath) ? dotenv.parse(readFileSync(envPath, ''utf-8''))
    : {};

    ...

    const mergedEnv = { ...existingEnv, ...$UPDATES };

    ...

    const safeEnvContent = stringify(mergedEnv);

    ...

    writeFileSync($PATH, safeEnvContent, ''utf-8'');

    '
  message: Insecure handling of .env file updates. The code directly manipulates environment
    variable content using regex-based string replacement without proper sanitization
    or structured parsing, which can lead to injection vulnerabilities. This vulnerability
    allows untrusted input to be written directly into the .env file without proper
    escaping or validation, potentially enabling attackers to inject malicious values
    that could compromise application security. Fix by using a proper environment
    variable parsing and serialization library like dotenv and dotenv-stringify to
    safely merge updates.
  languages:
  - typescript
  severity: ERROR
  metadata:
    source-url: github.com/YosefHayim/ebay-mcp/commit/aab0bda75ea9dd27aa37d0d8524d7cf41b3c4a9a
    category: security
    cwe:
    - CWE-117
    technology:
    - typescript
