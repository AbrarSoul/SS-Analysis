rules:
- id: vuln-logkitty-ef2f673e
  patterns:
  - pattern: execSync(...)
  - pattern: spawn(...)
  - pattern: child_process
  pattern-not: execFileSync(...)
  pattern-not-inside: 'import { spawn, execFileSync, ChildProcess } from ''child_process'';

    '
  message: Use of execSync() with untrusted input can lead to command injection vulnerabilities.
    Replace execSync() with execFileSync() and pass arguments as an array to prevent
    shell injection.
  severity: ERROR
  languages:
  - typescript
  metadata:
    source-url: github.com/zamotany/logkitty/commit/ef2f673e25c629544dd3de6429999318447dd6bf
    category: security
    cwe:
    - 78
    technology:
    - typescript
