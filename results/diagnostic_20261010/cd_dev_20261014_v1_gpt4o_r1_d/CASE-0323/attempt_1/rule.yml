rules:
- id: vuln-ckeditor-oembed-plugin-10f6169e
  patterns:
  - pattern: '''div(embeddedContent,oembed-provider-*) script'': { attributes: ''*''
      }'
  - pattern-not: // Removed or sanitized script tag handling
  languages:
  - javascript
  message: The CKEditor oEmbed plugin allows all attributes on script tags within
    embedded content, which can lead to XSS vulnerabilities. Ensure that script tags
    are not allowed or properly sanitized to prevent malicious code execution.
  severity: ERROR
  metadata:
    category: security
    cwe: CWE-79
    owasp: A7:2017
    source-url: github.com/w8tcha/CKEditor-oEmbed-Plugin/commit/10f6169e39510bbf5af913886037044458b9dc9b
    technology:
    - javascript
