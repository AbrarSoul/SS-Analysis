rules:
- id: vuln-hono-cf9a78db
  patterns:
  - pattern: const $KEY = $ASSET_MANIFEST[$PATH] || $PATH
  - pattern-not: const $KEY = $ASSET_MANIFEST[$PATH]
  languages:
  - typescript
  message: Using a fallback value when accessing an object property can lead to unexpected
    behavior and security issues. In this case, using 'ASSET_MANIFEST[path] || path'
    may result in using 'path' as a key if 'ASSET_MANIFEST[path]' is falsy, potentially
    leading to incorrect asset retrieval or exposure of unintended data. To fix this,
    ensure that the key is directly retrieved from 'ASSET_MANIFEST' without a fallback.
  severity: ERROR
  metadata:
    category: security
    cwe: CWE-704
    owasp: A6:2017-Security Misconfiguration
    source-url: github.com/honojs/hono/commit/cf9a78db4d0a19b117aee399cbe9d3a6d9bfd817
    technology:
    - typescript
