rules:
- id: vuln-ebay-mcp-aab0bda7
  patterns:
  - pattern: 'let $ENV_CONTENT = existsSync($ENV_PATH) ? readFileSync($ENV_PATH, ''utf-8'')
      : ''''; ... writeFileSync($ENV_PATH, $ENV_CONTENT, ''utf-8'');'
  - pattern-not: 'const $EXISTING_ENV = existsSync($ENV_PATH) ? dotenv.parse(readFileSync($ENV_PATH,
      ''utf-8'')) : {}; ... const $SAFE_ENV_CONTENT = stringify($MERGED_ENV); ...
      writeFileSync($ENV_PATH, $SAFE_ENV_CONTENT, ''utf-8'');'
  languages:
  - typescript
  message: 'Insecure handling of environment variables: Directly manipulating .env
    file content with string operations can lead to security issues such as injection
    vulnerabilities. Use a library like dotenv to parse and stringify environment
    variables securely.'
  severity: ERROR
  metadata:
    category: security
    cwe: CWE-20
    owasp: A6:2021-Security Misconfiguration
    source-url: github.com/YosefHayim/ebay-mcp/commit/aab0bda75ea9dd27aa37d0d8524d7cf41b3c4a9a
    technology:
    - typescript
