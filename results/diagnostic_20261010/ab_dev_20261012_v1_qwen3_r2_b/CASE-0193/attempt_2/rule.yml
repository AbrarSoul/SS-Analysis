rules:
- id: vuln-semantic-versioning-plugin-8df2fabd
  patterns:
  - pattern-either:
    - pattern: DocumentBuilderFactory.newInstance().newDocumentBuilder()
    - pattern: "DocumentBuilderFactory df = DocumentBuilderFactory.newInstance();\n\
        \        df.newDocumentBuilder()"
  - pattern-not: "DocumentBuilderFactory df = DocumentBuilderFactory.newInstance();\n\
      \        df.setAttribute(XMLConstants.ACCESS_EXTERNAL_DTD, \"\");\n        df.setAttribute(XMLConstants.ACCESS_EXTERNAL_SCHEMA,\
      \ \"\");\n        df.newDocumentBuilder()"
  languages:
  - java
  message: Insecure XML processing vulnerability (XXE) detected. The code creates
    a DocumentBuilderFactory without setting secure attributes to prevent external
    entity resolution. This can lead to XML External Entity attacks. Fix by setting
    both ACCESS_EXTERNAL_DTD and ACCESS_EXTERNAL_SCHEMA attributes to empty strings
    as shown in the patch.
  severity: ERROR
  metadata:
    category: security
    cwe: CWE-611
    owasp: OWASP-A04:2021
    source-url: github.com/jenkinsci/semantic-versioning-plugin/commit/8df2fabd7d7396ae29c374914d1357744d3e454f
    technology:
    - java
