rules:
- id: vuln-java-merge-sort-450fdee7
  pattern: 'File f = File.createTempFile($PREFIX, $SUFFIX);

    '
  pattern-not: 'File f = Files.createTempFile($PREFIX, $SUFFIX).toFile();

    '
  languages:
  - java
  message: Insecure temporary file creation detected. Using File.createTempFile can
    lead to security vulnerabilities such as file tampering or information disclosure.
    Use Files.createTempFile instead to ensure secure file creation.
  severity: ERROR
  metadata:
    source-url: github.com/cowtowncoder/java-merge-sort/commit/450fdee70b5f181c2afc5d817f293efa1a543902
    category: security
    cwe: CWE-377
    owasp: A9:2017
    references:
    - https://owasp.org/www-community/vulnerabilities/Insecure_Temporary_File
    technology: java
