rules:
- id: vuln-graphhopper-eb189be1
  patterns:
  - pattern: 'url.replaceFirst("/navigate/directions/v5/gh/" + profile + "/", "");

      url.replaceAll("\\?[*]", "");'
  - pattern-not: 'String urlStart = "/navigate/directions/v5/gh/" + profile + "/";

      if (!url.startsWith(urlStart)) throw new IllegalArgumentException("Incorrect
      URL " + url);

      url = url.substring(urlStart.length());'
  languages:
  - java
  message: Insecure URL handling vulnerability. The code uses replaceFirst() and replaceAll()
    to strip URL components, which can be bypassed by malicious input. This may lead
    to path traversal or injection attacks. Fix by validating the URL prefix with
    startsWith() and using substring() to extract the remaining part after the expected
    prefix.
  severity: ERROR
  metadata:
    category: security
    cwe: CWE-22
    owasp: OWASP-A01:2021
    source-url: github.com/graphhopper/graphhopper/commit/eb189be1fa7443ebf4ae881e737a18f818c95f41
    technology:
    - java
