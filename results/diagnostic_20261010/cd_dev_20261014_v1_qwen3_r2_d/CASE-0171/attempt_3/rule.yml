rules:
- id: vuln-graphhopper-eb189be1
  patterns:
  - pattern: 'url.replaceFirst("/navigate/directions/v5/gh/" + profile + "/", "");

      url.replaceAll("\\?[*]", "");'
  - pattern-not: if (!url.startsWith(urlStart)) throw new IllegalArgumentException("Incorrect
      URL " + url);
  languages:
  - java
  message: Insecure URL handling vulnerability. The code uses replaceFirst() and replaceAll()
    to strip URL components without proper validation, potentially allowing path traversal
    or injection attacks. The fix should validate that the URL starts with the expected
    prefix before processing it. Always validate input URLs and use explicit prefix
    checking instead of regex-based stripping.
  severity: ERROR
  metadata:
    category: security
    cwe: CWE-20
    owasp: OWASP-A03:2021
    source-url: github.com/graphhopper/graphhopper/commit/eb189be1fa7443ebf4ae881e737a18f818c95f41
    technology:
    - java
