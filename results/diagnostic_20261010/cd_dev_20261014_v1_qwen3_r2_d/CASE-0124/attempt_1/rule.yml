rules:
- id: vuln-sagemaker-python-sdk-2d873d53
  patterns:
  - pattern: os.system($CMD)
  - pattern-not: subprocess.run($CMD, check=True, capture_output=True)
  languages:
  - python
  message: Use of os.system() with string command can lead to shell injection vulnerabilities.
    The command is executed in a shell context which allows arbitrary command execution.
    Replace with subprocess.run() using a list of arguments to avoid shell interpretation.
  severity: ERROR
  metadata:
    category: security
    cwe: CWE-78
    owasp: A01:2021-Broken Access Control
    references:
    - https://docs.python.org/3/library/os.html#os.system
    - https://docs.python.org/3/library/subprocess.html#subprocess.run
    source-url: github.com/aws/sagemaker-python-sdk/commit/2d873d53f708ea570fc2e2a6974f8c3097fe9df5
    technology:
    - python
