rules:
- id: vuln-hono-cf9a78db
  patterns:
  - pattern: const $KEY = $OBJECT[$INDEX] || $FALLBACK
  - pattern-not: const $KEY = $OBJECT[$INDEX]
  languages:
  - typescript
  message: Using a fallback value when accessing an object property can lead to unexpected
    behavior and security issues. In this case, using 'ASSET_MANIFEST[path] || path'
    may result in using 'path' as a key when 'ASSET_MANIFEST[path]' is undefined,
    potentially causing incorrect asset retrieval or exposure. To fix this, remove
    the fallback and ensure 'ASSET_MANIFEST[path]' is defined before use.
  severity: ERROR
  metadata:
    category: security
    cwe: CWE-704
    owasp: A6:2017-Security Misconfiguration
    source-url: github.com/honojs/hono/commit/cf9a78db4d0a19b117aee399cbe9d3a6d9bfd817
    technology:
    - typescript
