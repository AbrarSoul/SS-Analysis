rules:
- id: vuln-logkitty-ef2f673e
  patterns:
  - pattern: execSync($COMMAND)
  - pattern-not: execFileSync($COMMAND, $ARGS)
  languages:
  - typescript
  message: Using execSync with a command string can lead to command injection vulnerabilities.
    It is safer to use execFileSync with an array of arguments to avoid shell interpretation
    of the command. Update your code to use execFileSync with an argument array.
  severity: ERROR
  metadata:
    category: security
    cwe: CWE-78
    owasp: A01:2021-Broken Access Control
    source-url: github.com/zamotany/logkitty/commit/ef2f673e25c629544dd3de6429999318447dd6bf
    technology:
    - typescript
