rules:
- id: vuln-notesnook-e87f5e5f
  patterns:
  - pattern: <a href="${src}?ref_src=twsrc%5Etfw"></a>
  - pattern-not: 'const anchor = document.createElement("a");

      anchor.href = `${src}?ref_src=twsrc%5Etfw`;

      $HTML = `${anchor.outerHTML}`;'
  languages:
  - typescript
  message: Directly embedding user-controlled URLs in HTML can lead to security vulnerabilities
    such as XSS. Instead, create DOM elements programmatically and set their properties
    to ensure proper escaping and sanitization. In this case, use 'document.createElement'
    and set 'href' on the anchor element.
  severity: ERROR
  metadata:
    category: security
    cwe: CWE-79
    owasp: A7:2017-Cross-Site Scripting (XSS)
    source-url: github.com/streetwriters/notesnook/commit/e87f5e5f899f45df28d7c0f33f15e9178d1fbcb7
    technology:
    - typescript
