rules:
- id: vuln-nocodb-079e3abe
  patterns:
  - pattern: Papaparse.unparse($OBJ)
  - pattern-not: 'Papaparse.unparse($OBJ, { escapeFormulae: true, ... })'
  languages:
  - typescript
  message: 'The use of Papaparse.unparse without the ''escapeFormulae'' option set
    to true can lead to CSV injection vulnerabilities. This allows attackers to inject
    malicious formulas into CSV files, which can be executed when the file is opened
    in spreadsheet software. To fix this, ensure that ''escapeFormulae: true'' is
    included in the options object passed to Papaparse.unparse.'
  severity: ERROR
  metadata:
    category: security
    cwe: CWE-1236
    owasp: A1:2017-Injection
    source-url: github.com/nocodb/nocodb/commit/079e3abe98a054f5304592def7a0e8fdb9b06eee
    technology:
    - typescript
