rules:
- id: vuln-java-merge-sort-450fdee7
  patterns:
  - pattern: File.createTempFile($PREFIX, $SUFFIX)
  - pattern-not: Files.createTempFile($PREFIX, $SUFFIX).toFile()
  languages:
  - java
  message: Insecure temporary file creation detected. Using File.createTempFile()
    can lead to security vulnerabilities such as information disclosure or privilege
    escalation due to predictable file names. Use Files.createTempFile() instead,
    which provides better security by using the system's temporary file directory
    and ensuring unique file names.
  severity: ERROR
  metadata:
    category: security
    cwe: CWE-377
    owasp: A9:2017-Using Components with Known Vulnerabilities
    source-url: github.com/cowtowncoder/java-merge-sort/commit/450fdee70b5f181c2afc5d817f293efa1a543902
    technology:
    - java
