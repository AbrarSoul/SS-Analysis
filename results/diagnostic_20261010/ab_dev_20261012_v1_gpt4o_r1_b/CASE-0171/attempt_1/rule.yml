rules:
- id: vuln-graphhopper-eb189be1
  patterns:
  - pattern: $URL = $URL.replaceFirst("/navigate/directions/v5/gh/" + $PROFILE + "/",
      "");
  - pattern-not: 'if (!$URL.startsWith("/navigate/directions/v5/gh/" + $PROFILE +
      "/")) throw new IllegalArgumentException($EXCEPTION);

      $URL = $URL.substring(("/navigate/directions/v5/gh/" + $PROFILE + "/").length());'
  languages:
  - java
  message: Potential URL manipulation vulnerability. Ensure the URL starts with the
    expected prefix before modifying it to prevent incorrect URL handling. Use startsWith()
    to validate the URL prefix.
  severity: ERROR
  metadata:
    category: security
    cwe: CWE-20
    owasp: A01:2021-Broken Access Control
    source-url: github.com/graphhopper/graphhopper/commit/eb189be1fa7443ebf4ae881e737a18f818c95f41
    technology:
    - java
