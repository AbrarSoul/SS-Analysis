rules:
- id: vuln-logkitty-ef2f673e
  patterns:
  - pattern: execSync(`$CMD`)
  - pattern-not: execFileSync($CMD, ...)
  languages:
  - typescript
  message: Using execSync with concatenated strings can lead to command injection
    vulnerabilities. Replace execSync with execFileSync and pass arguments as an array
    to avoid shell interpretation.
  severity: ERROR
  metadata:
    category: security
    cwe: CWE-78
    owasp: A01:2021 - Broken Access Control
    source-url: github.com/zamotany/logkitty/commit/ef2f673e25c629544dd3de6429999318447dd6bf
    technology:
    - typescript
