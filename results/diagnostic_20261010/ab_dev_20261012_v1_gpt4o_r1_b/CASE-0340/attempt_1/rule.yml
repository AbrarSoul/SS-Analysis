rules:
- id: vuln-logkitty-ef2f673e
  patterns:
  - pattern: execSync(`${$CMD} $ARGS`)
  - pattern-not: execFileSync($CMD, [$ARGS, ...])
  languages:
  - typescript
  message: Using execSync with concatenated strings can lead to command injection
    vulnerabilities. Use execFileSync with an array of arguments to avoid this risk.
  severity: ERROR
  metadata:
    category: security
    cwe: CWE-78
    owasp: A01:2021-Broken Access Control
    source-url: github.com/zamotany/logkitty/commit/ef2f673e25c629544dd3de6429999318447dd6bf
    technology:
    - typescript
