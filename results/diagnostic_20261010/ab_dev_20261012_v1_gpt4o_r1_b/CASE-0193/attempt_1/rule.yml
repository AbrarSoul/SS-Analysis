rules:
- id: vuln-semantic-versioning-plugin-8df2fabd
  patterns:
  - pattern: 'DocumentBuilderFactory $DBF = DocumentBuilderFactory.newInstance();

      $DBF.newDocumentBuilder();'
  - pattern-not: 'DocumentBuilderFactory $DBF = DocumentBuilderFactory.newInstance();

      $DBF.setAttribute(XMLConstants.ACCESS_EXTERNAL_DTD, "");

      $DBF.setAttribute(XMLConstants.ACCESS_EXTERNAL_SCHEMA, "");

      $DBF.newDocumentBuilder();'
  languages:
  - java
  message: XML External Entity (XXE) vulnerability detected. Ensure that DocumentBuilderFactory
    is configured to disable external DTDs and schemas by setting XMLConstants.ACCESS_EXTERNAL_DTD
    and XMLConstants.ACCESS_EXTERNAL_SCHEMA to an empty string.
  severity: ERROR
  metadata:
    category: security
    cwe: CWE-611
    owasp: A4:2017-XML External Entities (XXE)
    source-url: github.com/jenkinsci/semantic-versioning-plugin/commit/8df2fabd7d7396ae29c374914d1357744d3e454f
    technology:
    - java
