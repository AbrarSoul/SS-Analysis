rules:
- id: vuln-notesnook-e87f5e5f
  patterns:
  - pattern: <a href="${src}?ref_src=twsrc%5Etfw"></a>
  - pattern-not: 'const anchor = document.createElement("a");

      anchor.href = `${src}?ref_src=twsrc%5Etfw`;

      $... = anchor.outerHTML;'
  languages:
  - typescript
  message: Directly embedding user-controlled URLs into HTML without sanitization
    can lead to security vulnerabilities such as XSS. Ensure URLs are properly sanitized
    or constructed using safe methods like creating DOM elements programmatically.
  severity: ERROR
  metadata:
    category: security
    cwe: CWE-79
    owasp: A7:2017-Cross-Site Scripting (XSS)
    source-url: github.com/streetwriters/notesnook/commit/e87f5e5f899f45df28d7c0f33f15e9178d1fbcb7
    technology:
    - typescript
