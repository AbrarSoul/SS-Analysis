rules:
- id: vuln-hono-cf9a78db
  patterns:
  - pattern: const $KEY = $OBJECT[$INDEX] || $INDEX
  - pattern-not: const $KEY = $OBJECT[$INDEX]
  languages:
  - typescript
  message: Using a fallback value when accessing an object property can lead to unexpected
    behavior and security issues. In this case, if 'ASSET_MANIFEST[path]' is undefined,
    the code defaults to 'path', which might not be intended and could expose sensitive
    paths or data. To fix this, ensure that the key is explicitly checked or handled
    without defaulting to the input path.
  severity: ERROR
  metadata:
    category: security
    cwe: CWE-704
    owasp: A6:2017-Security Misconfiguration
    source-url: github.com/honojs/hono/commit/cf9a78db4d0a19b117aee399cbe9d3a6d9bfd817
    technology:
    - typescript
