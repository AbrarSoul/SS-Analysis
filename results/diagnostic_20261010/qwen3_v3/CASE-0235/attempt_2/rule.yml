rules:
- id: vuln-ws-scrcpy-e83cf654
  pattern: "if ($PATHNAME.indexOf($PUBLICDIR) !== 0) {\n    ...\n}\n"
  pattern-not: "if ($PATHNAME.indexOf($PUBLICDIR) !== 0) {\n    $RES.statusCode =\
    \ 403;\n    $RES.end();\n    return;\n}\n"
  languages:
  - typescript
  message: Directory traversal vulnerability detected. The code checks if a pathname
    starts with a public directory but doesn't properly handle the case where it does
    not, potentially allowing access to unauthorized files. This can lead to sensitive
    data exposure. Fix by ensuring proper HTTP status code and response handling when
    validation fails.
  severity: ERROR
  metadata:
    source-url: github.com/netristv/ws-scrcpy/commit/e83cf65438bef83a3503b25358bba97bcc156fef
    category: security
    cwe:
    - 22
    owasp:
    - OWASP Top 10:2021 - A01:2021 - Broken Access Control
    references:
    - https://owasp.org/www-project-top-ten/OWASP_Top_Ten_2021/Top_10_A01_Broken_Access_Control
    technology:
    - typescript
