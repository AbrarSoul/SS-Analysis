rules:
- id: vuln-logkitty-ef2f673e
  pattern: 'execSync($CMD, ...)

    '
  pattern-not: 'execFileSync($CMD, ...)

    '
  languages:
  - typescript
  message: 'Vulnerable use of execSync() function. This can lead to command injection
    vulnerabilities when user input is included in the command string. The execSync()
    function executes commands synchronously and can be dangerous if not properly
    sanitized. Replace with execFileSync() and pass arguments as an array to avoid
    shell injection risks.

    '
  severity: ERROR
  metadata:
    source-url: github.com/zamotany/logkitty/commit/ef2f673e25c629544dd3de6429999318447dd6bf
    category: security
    cwe:
    - 78
    owasp:
    - A03:2021
    references:
    - https://nodejs.org/api/child_process.html#child_process_execsync
    - https://owasp.org/www-project-top-ten/2021/A03_2021-Injection
    technology:
    - typescript
