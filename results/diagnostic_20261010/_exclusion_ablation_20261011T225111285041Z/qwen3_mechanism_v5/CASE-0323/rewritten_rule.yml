rules:
- id: vuln-ckeditor-oembed-plugin-10f6169e
  patterns:
  - pattern: "'div(embeddedContent,oembed-provider-*) script': {\n    attributes:\
      \ '*'\n}\n"
  - pattern-not: "'div(embeddedContent,oembed-provider-*) script': {\n    attributes:\
      \ '*'\n}\n"
  languages:
  - javascript
  message: Potential XSS vulnerability in CKEditor oEmbed plugin. The plugin allows
    all script attributes to be set, which can lead to arbitrary code execution when
    embedded content is rendered. This vulnerability was patched by restricting attribute
    handling for embedded content scripts. Fix by sanitizing or restricting script
    attributes.
  severity: ERROR
  metadata:
    source-url: github.com/w8tcha/CKEditor-oEmbed-Plugin/commit/10f6169e39510bbf5af913886037044458b9dc9b
    category: security
    cwe: CWE-79
    technology:
    - javascript
