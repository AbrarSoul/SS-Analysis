rules:
- id: vuln-ckeditor-oembed-plugin-10f6169e
  patterns:
  - pattern: "'div(embeddedContent,oembed-provider-*) script': {\n    attributes:\
      \ '*'\n}\n"
  languages:
  - javascript
  message: Potential XSS vulnerability in CKEditor oEmbed plugin. The wildcard attribute
    matching ('*') allows arbitrary script execution and can lead to code injection.
    Remove the '*' attribute or implement strict attribute validation to prevent malicious
    scripts from being embedded.
  severity: ERROR
  metadata:
    source-url: github.com/w8tcha/CKEditor-oEmbed-Plugin/commit/10f6169e39510bbf5af913886037044458b9dc9b
    category: security
    cwe: CWE-79
    owasp: OWASP-M01
    technology: javascript
    references:
    - https://owasp.org/www-community/attacks/xss/
    - https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html
