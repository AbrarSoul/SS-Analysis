rules:
- id: vuln-jspdf-d8bb3b39
  patterns:
  - pattern: 'var $EXTRACTEDINFO = /^data:(\w*\/\w*);*(charset=[\w=-]*)*;*$/.exec($DATA)

      '
  languages:
  - javascript
  message: Insecure regex pattern for data URI parsing allows malicious charset injection.
    The regex should use a negative lookahead to prevent 'charset=' from appearing
    in the charset parameter, otherwise it may lead to unexpected behavior or security
    issues when processing data URIs with crafted charset values.
  severity: ERROR
  metadata:
    source-url: github.com/MrRio/jsPDF/commit/d8bb3b39efcd129994f7a3b01b632164144ec43e
    category: security
    cwe: CWE-1321
    technology:
    - javascript
