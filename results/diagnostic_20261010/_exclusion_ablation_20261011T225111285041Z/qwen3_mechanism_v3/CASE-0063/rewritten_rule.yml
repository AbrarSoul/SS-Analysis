rules:
- id: vuln-jspdf-d8bb3b39
  patterns:
  - pattern: /^data:(\w*\/\w*);*(charset=[\w=-]*)*;*$/.exec($VAR)
  - pattern-inside: "function $FUNC(...) {\n  ...\n}"
  - pattern-not: /^data:(\w*\/\w*);*(charset=(?!charset=)[\w=-]*)*;*$/.exec($VAR)
  languages:
  - javascript
  message: Insecure regex pattern for data URI parsing allows malicious charset injection.
    The regex should prevent charset= from appearing in the charset parameter to avoid
    bypassing security checks. Fix by adding negative lookahead assertion (?!charset=)
    to prevent unsafe charset values.
  severity: ERROR
  metadata:
    source-url: github.com/MrRio/jsPDF/commit/d8bb3b39efcd129994f7a3b01b632164144ec43e
    category: security
    cwe: CWE-20
    technology:
    - javascript
