rules:
- id: vuln-semantic-versioning-plugin-8df2fabd
  pattern: '$DBF = DocumentBuilderFactory.newInstance()

    ...

    $DB = $DBF.newDocumentBuilder()

    '
  pattern-not: '$DBF = DocumentBuilderFactory.newInstance()

    $DBF.setAttribute(XMLConstants.ACCESS_EXTERNAL_DTD, "")

    $DBF.setAttribute(XMLConstants.ACCESS_EXTERNAL_SCHEMA, "")

    $DB = $DBF.newDocumentBuilder()

    '
  languages:
  - java
  message: DocumentBuilderFactory is not configured securely. Ensure that XMLConstants.ACCESS_EXTERNAL_DTD
    and XMLConstants.ACCESS_EXTERNAL_SCHEMA are set to empty strings to prevent XXE
    vulnerabilities.
  severity: ERROR
  metadata:
    source-url: github.com/jenkinsci/semantic-versioning-plugin/commit/8df2fabd7d7396ae29c374914d1357744d3e454f
    category: security
    cwe: CWE-611
    owasp: A4:2017-XML External Entities (XXE)
    references:
    - https://owasp.org/www-community/vulnerabilities/XML_External_Entity_(XXE)_Processing
    technology: java
