rules:
- id: vuln-graphhopper-eb189be1
  patterns:
  - pattern: '$URL = $URL.replaceFirst(...);

      $URL = $URL.replaceAll(...);

      '
  - pattern-inside: "class $CLASS {\n    ...\n}\n"
  - pattern-not: 'if (!$URL.startsWith(...)) throw new IllegalArgumentException(...);

      $URL = $URL.substring(...);

      '
  languages:
  - java
  message: Potential insecure URL handling vulnerability. The code performs string
    replacement operations on unvalidated URLs without checking the URL prefix, which
    could allow arbitrary path manipulation. This can lead to path traversal or other
    injection attacks. Fix by validating the URL prefix before processing and throwing
    an exception if it does not match expected format.
  severity: ERROR
  metadata:
    source-url: github.com/graphhopper/graphhopper/commit/eb189be1fa7443ebf4ae881e737a18f818c95f41
    category: security
    cwe:
    - CWE-22
    technology:
    - java
