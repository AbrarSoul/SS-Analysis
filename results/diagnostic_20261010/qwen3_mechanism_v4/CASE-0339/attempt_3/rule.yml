rules:
- id: vuln-trilium-4c3fcc3e
  pattern: $RESULT.highlightedNotePathTitle = $RESULT.notePathTitle.replace(/[<\{\}]/g,
    '')
  pattern-not: $RESULT.highlightedNotePathTitle = $RESULT.notePathTitle.replace(/[<{}]/g,
    '')
  languages:
  - javascript
  message: Potential insecure regex pattern in replace() call. The original regex
    '/[<\{\}]/g' includes a backslash-escaped brace character which may be vulnerable
    to regex injection or incorrect escaping. The fix removes the unnecessary escape,
    changing it to '/[<{}]/g'. Ensure all regex patterns are properly escaped and
    validated to prevent regex injection vulnerabilities.
  severity: WARNING
  metadata:
    source-url: github.com/zadam/trilium/commit/4c3fcc3ea6f37debcb87ac1a7f5698c27be0e67b
    category: security
    cwe: CWE-1321
    technology:
    - javascript
