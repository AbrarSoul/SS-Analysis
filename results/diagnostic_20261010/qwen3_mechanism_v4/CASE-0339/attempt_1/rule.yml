rules:
- id: vuln-trilium-4c3fcc3e
  pattern: $RESULT.HIGHLIGHTEDNOTEPTITLE = $RESULT.NOTEPTITLE.replace(/[$X]/g, '');
  pattern-not: $RESULT.HIGHLIGHTEDNOTEPTITLE = $RESULT.NOTEPTITLE.replace(/[<{}]/g,
    '');
  languages:
  - javascript
  message: Potential insecure regex replacement vulnerability. The regex pattern includes
    '<' and '{' characters which could allow malicious input to bypass sanitization.
    Fix by properly escaping special regex characters or using a safer replacement
    method.
  severity: ERROR
  metadata:
    source-url: github.com/zadam/trilium/commit/4c3fcc3ea6f37debcb87ac1a7f5698c27be0e67b
    category: security
    cwe: CWE-116
    technology:
    - javascript
