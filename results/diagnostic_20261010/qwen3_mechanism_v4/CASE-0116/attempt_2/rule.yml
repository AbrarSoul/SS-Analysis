rules:
- id: vuln-thrift-0919c3d5
  pattern-either:
  - patterns:
    - pattern: $SOCKET.getSSLParameters()
    - pattern-not: $SOCKET.getSSLParameters().setEndpointIdentificationAlgorithm("HTTPS")
    - pattern-not: $SOCKET.setSSLParameters($PARAMS)
  - patterns:
    - pattern: $SOCKET.setSSLParameters($PARAMS)
    - pattern-not: $PARAMS.setEndpointIdentificationAlgorithm("HTTPS")
    - pattern-not: $SOCKET.getSSLParameters()
  languages:
  - java
  message: Missing endpoint identification algorithm configuration in SSL/TLS connection.
    This vulnerability allows for man-in-the-middle attacks as the client does not
    verify the server's identity. Fix by setting the endpoint identification algorithm
    to "HTTPS" using socket.setSSLParameters(sslParams) after retrieving parameters
    with getSSLParameters().
  severity: ERROR
  metadata:
    source-url: github.com/apache/thrift/commit/0919c3d5506151514e283a63e1fe1ce83e2449d8
    category: security
    cwe: CWE-295
    technology:
    - java
