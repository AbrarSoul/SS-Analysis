rules:
- id: vuln-graphhopper-eb189be1
  pattern-either:
  - patterns:
    - pattern: $URL.replaceFirst("/navigate/directions/v5/gh/" + $PROFILE + "/", "")
    - pattern-not: $URL.startsWith("/navigate/directions/v5/gh/" + $PROFILE + "/")
  - patterns:
    - pattern: $URL.replaceAll("\\?[*]", "")
    - pattern-not: $URL.startsWith("/navigate/directions/v5/gh/" + $PROFILE + "/")
  languages:
  - java
  message: Potential insecure URL handling vulnerability. The code performs string
    manipulation on unvalidated URLs without checking if they start with the expected
    prefix, which could allow arbitrary path traversal or injection attacks. Fix by
    validating the URL prefix before processing.
  severity: ERROR
  metadata:
    source-url: github.com/graphhopper/graphhopper/commit/eb189be1fa7443ebf4ae881e737a18f818c95f41
    category: security
    cwe: CWE-20
    technology:
    - java
  pattern-not: 'if (!$URL.startsWith("/navigate/directions/v5/gh/" + $PROFILE + "/"))
    throw new IllegalArgumentException("Incorrect URL " + $URL);

    $URL = $URL.substring("/navigate/directions/v5/gh/" + $PROFILE + "/".length());'
