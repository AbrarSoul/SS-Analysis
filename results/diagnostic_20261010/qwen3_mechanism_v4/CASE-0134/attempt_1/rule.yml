rules:
- id: vulnerable-ifttt-event-pattern
  pattern-not: r'((?P<events>(/[A-Z0-9_-]+)+))?'
  patterns:
  - pattern: r'/?(?P<events>([A-Z0-9_-]+/?)+)?'
  - pattern-inside: "def $FUNC(...):\n    ...\n"
  languages:
  - python
  message: Vulnerable regex pattern for IFTTT events allows for path traversal and
    injection attacks. The pattern '/?(?P<events>([A-Z0-9_-]+/?)+)?' is susceptible
    to malicious input that can bypass validation checks. Fix by using a stricter
    pattern like '((?P<events>(/[A-Z0-9_-]+)+))?' to prevent directory traversal and
    ensure proper event name validation.
  severity: ERROR
  metadata:
    source-url: github.com/caronc/apprise/commit/e20fce630d55e4ca9b0a1e325a5fea6997489831
    category: security
    cwe: CWE-22
    owasp: A01:2021-Broken Access Control
    technology:
    - python
