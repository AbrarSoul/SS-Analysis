rules:
- id: ebay-mcp-env-file-injection
  patterns:
  - pattern: "import { readFileSync, writeFileSync } from 'fs';\n...\nlet $ENVCONTENT\
      \ = existsSync($PATH) ? readFileSync($PATH, 'utf-8') : '';\n...\nfor (const\
      \ [key, value] of Object.entries($UPDATES)) {\n    ...\n    const regex = new\
      \ RegExp(`^(#\\\\s*)?${key}=.*$`, 'gm');\n    ...\n    if (regex.test($ENVCONTENT))\
      \ {\n        $ENVCONTENT = $ENVCONTENT.replace(regex, $NEWLINE);\n    } else\
      \ {\n        $ENVCONTENT += `\\n${$NEWLINE}`;\n    }\n}\n...\nwriteFileSync($PATH,\
      \ $ENVCONTENT, 'utf-8');\n"
  pattern-not: 'import dotenv from ''dotenv'';

    ...

    const existingEnv = existsSync($PATH) ? dotenv.parse(readFileSync($PATH, ''utf-8''))
    : {};

    ...

    const mergedEnv = { ...existingEnv, ...$UPDATES };

    ...

    import stringify from ''dotenv-stringify'';

    ...

    const safeEnvContent = stringify(mergedEnv);

    ...

    writeFileSync($PATH, safeEnvContent, ''utf-8'');

    '
  languages:
  - typescript
  message: Potential environment file injection vulnerability. Direct manipulation
    of .env file content without proper sanitization can lead to arbitrary code execution
    or configuration compromise. Use dotenv and dotenv-stringify libraries for secure
    environment variable handling.
  severity: ERROR
  metadata:
    source-url: github.com/YosefHayim/ebay-mcp/commit/aab0bda75ea9dd27aa37d0d8524d7cf41b3c4a9a
    category: security
    cwe: CWE-94
    technology:
    - typescript
