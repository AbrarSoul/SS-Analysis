rules:
- id: quark-auto-save-batch-assignment-vulnerability
  pattern-either:
  - patterns:
    - pattern: "$DICT[$KEY] = $VAL\n...\nif $KEY not in $LIST:\n    ...\n    $DICT[$KEY]\
        \ = $VAL\n"
    - pattern-not: "if $KEY in $ALLOWED_LIST:\n    ...\n    $DICT[$KEY] = $VAL\n"
  - patterns:
    - pattern: "for $KEY, $VAL in $ITEMS:\n    ...\n    if $KEY not in $LIST:\n  \
        \      ...\n        $DICT[$KEY] = $VAL\n"
    - pattern-not: "for $KEY, $VAL in $ITEMS:\n    ...\n    if $KEY in $ALLOWED_LIST:\n\
        \        ...\n        $DICT[$KEY] = $VAL\n"
  languages:
  - python
  message: Potential batch assignment vulnerability detected. The code uses a blacklist
    approach to filter keys, which is vulnerable to bypass attacks. Use an allowlist
    instead to prevent unauthorized key assignments. This can lead to arbitrary code
    execution or data exposure.
  severity: ERROR
  metadata:
    source-url: github.com/Cp0204/quark-auto-save/commit/ea8377a596446291953dbe36e2d119d85bcd865b
    category: security
    cwe: CWE-20
    owasp: A01:2021-Broken Access Control
    technology:
    - python
