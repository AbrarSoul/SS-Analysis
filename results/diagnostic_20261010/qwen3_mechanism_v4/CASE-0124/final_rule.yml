rules:
- id: vuln-sagemaker-python-sdk-2d873d53
  pattern-either:
  - patterns:
    - pattern: os.system($CMD)
    - pattern-not: subprocess.run($CMD, ...)
    - pattern-inside: "def $FUNC(...):\n    ...\n"
  - pattern: os.system(...)
  message: Detected use of os.system() with potentially untrusted input, which can
    lead to command injection vulnerabilities. Use subprocess.run() with a list of
    arguments instead to prevent shell injection.
  severity: ERROR
  languages:
  - python
  metadata:
    source-url: github.com/aws/sagemaker-python-sdk/commit/2d873d53f708ea570fc2e2a6974f8c3097fe9df5
    category: security
    cwe: CWE-78
    owasp: A01:2021-Broken Access Control
    references:
    - https://docs.python.org/3/library/os.html#os.system
    - https://docs.python.org/3/library/subprocess.html#subprocess.run
    technology:
    - python
