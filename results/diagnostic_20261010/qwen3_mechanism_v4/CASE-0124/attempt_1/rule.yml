rules:
- id: vuln-sagemaker-python-sdk-2d873d53
  pattern-either:
  - '$CMD = f"...{...}..."

    os.system($CMD)

    '
  - '$CMD = "...$VAR..."

    os.system($CMD)

    '
  - '$CMD = "$VAR"

    os.system($CMD)

    '
  pattern-not: 'subprocess.run($CMD, check=True, capture_output=True)

    '
  pattern-inside: "def $FUNC(...):\n    ...\n"
  languages:
  - python
  message: Detected use of os.system() with dynamically constructed command strings,
    which is vulnerable to command injection. The command string is built using f-strings
    or string formatting and passed directly to os.system(). This can allow attackers
    to execute arbitrary commands on the system. Fix by using subprocess.run() with
    a list of arguments instead of a shell command string.
  severity: ERROR
  metadata:
    source-url: github.com/aws/sagemaker-python-sdk/commit/2d873d53f708ea570fc2e2a6974f8c3097fe9df5
    category: security
    cwe: CWE-78
    technology:
    - python
