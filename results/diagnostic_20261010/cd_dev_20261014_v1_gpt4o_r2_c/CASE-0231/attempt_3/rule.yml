rules:
- id: vuln-agentscope-7d285e86
  pattern: 'filename = $FUNC(filename)

    '
  pattern-not: "if not filename.endswith(\".json\"):\n    return jsonify({\"error\"\
    : \"Only JSON files can be deleted\"})\nfilename = os.path.basename(filename)\n"
  languages:
  - python
  message: Potential directory traversal vulnerability. Ensure the filename is sanitized
    before use. Use os.path.basename to prevent directory traversal attacks.
  severity: ERROR
  metadata:
    source-url: github.com/modelscope/agentscope/commit/7d285e862f86fa1d96ed04c4cd40a5f1b8f9189a
    category: security
    cwe: CWE-22
    owasp: A5:2017-Broken Access Control
    references:
    - https://owasp.org/www-community/attacks/Path_Traversal
    technology: python
