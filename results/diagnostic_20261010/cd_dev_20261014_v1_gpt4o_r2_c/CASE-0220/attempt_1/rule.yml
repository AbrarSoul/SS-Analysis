rules:
- id: vuln-phpldapadmin-dd6e9583
  pattern: '$REQUEST.setRequestHeader(''Content-length'', $PARAM.length);

    '
  pattern-not: '$REQUEST.setRequestHeader(''Content-length'', $PARAM.length);

    $REQUEST.setRequestHeader(''Connection'', ''close'');

    '
  languages:
  - javascript
  message: Setting 'Content-length' and 'Connection' headers manually can lead to
    security issues. These headers should be managed by the browser or server to prevent
    potential vulnerabilities such as request smuggling or other HTTP header attacks.
  severity: ERROR
  metadata:
    source-url: github.com/mhuertos/phpLDAPadmin/commit/dd6e9583a2eb2ca085583765e8a63df5904cb036
    category: security
    cwe: CWE-444
    owasp: A6:2017-Security Misconfiguration
    references:
    - https://owasp.org/www-community/attacks/HTTP_Response_Splitting
    technology: javascript
