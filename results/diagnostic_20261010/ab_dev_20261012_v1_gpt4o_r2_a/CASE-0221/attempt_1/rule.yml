rules:
- id: vuln-micronaut-core-9d1eff5c
  pattern: 'new DefaultHttpHeaders(false)

    '
  pattern-not: 'new DefaultHttpHeaders()

    '
  languages:
  - java
  message: Potential vulnerability due to the use of DefaultHttpHeaders with validation
    disabled. This can lead to security issues as headers are not validated. Use DefaultHttpHeaders()
    to ensure headers are validated.
