rules:
- id: vuln-quark-auto-save-ea8377a5
  pattern: 'dont_save_keys = $LIST

    ...

    if $KEY not in dont_save_keys:

    '
  pattern-not: 'allowed_keys = $LIST

    ...

    if $KEY in allowed_keys:

    '
  languages:
  - python
  message: Detected potential mass assignment vulnerability due to use of a blacklist.
    This can lead to unauthorized data modification. Use a whitelist approach to specify
    allowed keys explicitly.
  severity: ERROR
  metadata:
    source-url: github.com/Cp0204/quark-auto-save/commit/ea8377a596446291953dbe36e2d119d85bcd865b
    category: security
    cwe: CWE-915
    owasp: A4:2017-XML External Entities (XXE)
    references:
    - https://owasp.org/www-community/attacks/Mass_Assignment
    technology: python
