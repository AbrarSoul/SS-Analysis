rules:
- id: cpython-importlib-loader-vulnerability
  pattern-either:
  - patterns:
    - pattern: isinstance($SELF, (SourceLoader, ExtensionFileLoader))
    - pattern-not: isinstance($SELF, (SourceLoader, SourcelessFileLoader, ExtensionFileLoader))
  languages:
  - python
  message: Missing SourcelessFileLoader in isinstance check for loader type. This
    could allow unauthorized code execution by bypassing security checks that should
    apply to all file loaders including sourceless ones. Fix by including SourcelessFileLoader
    in the isinstance check.
  severity: ERROR
  metadata:
    source-url: github.com/python/cpython/commit/482d6f8bdba9da3725d272e8bb4a2d25fb6a603e
    category: security
    cwe: CWE-22
    references:
    - https://docs.python.org/3/library/importlib.html
    - https://github.com/python/cpython/commit/482d6f8bdba9da3725d272e8bb4a2d25fb6a603e
    technology:
    - python
