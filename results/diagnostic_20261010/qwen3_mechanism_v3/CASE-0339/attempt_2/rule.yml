rules:
- id: trilium-xss-path-title
  pattern: $RESULT.highlightedNotePathTitle = $RESULT.notePathTitle.replace(/[$PATTERN]/g,
    '');
  pattern-not: $RESULT.highlightedNotePathTitle = $RESULT.notePathTitle.replace(/[<{}]/g,
    '');
  languages:
  - javascript
  message: Potential XSS vulnerability in note path title handling. The regex pattern
    excludes '<' and '{' characters but not '<' or '}' which could allow malicious
    content to be injected into the UI. Fix by ensuring all potentially dangerous
    HTML characters are properly escaped or filtered.
  severity: WARNING
  metadata:
    source-url: github.com/zadam/trilium/commit/4c3fcc3ea6f37debcb87ac1a7f5698c27be0e67b
    category: security
    cwe: CWE-79
    technology:
    - javascript
