rules:
- id: vuln-git-client-plugin-75ea3fe0
  pattern-either:
  - patterns:
    - pattern: File.createTempFile($PREFIX, $SUFFIX)
    - pattern-not: File.createTempFile($PREFIX, $SUFFIX, $DIR)
  - patterns:
    - pattern: Files.createTempFile($PATH, $PREFIX, $SUFFIX)
    - pattern-not: Files.createTempFile($PATH, $PREFIX, $SUFFIX, $ATTR)
  languages:
  - java
  message: Use of insecure temporary file creation without proper permissions. The
    vulnerable code uses File.createTempFile() or Files.createTempFile() without setting
    restrictive file permissions (e.g., rw-------), which can lead to privilege escalation
    or information disclosure vulnerabilities on Unix-like systems. Fix by using Files.createTempFile()
    with appropriate FileAttribute for restricted permissions.
  severity: ERROR
  metadata:
    source-url: github.com/jenkinsci/git-client-plugin/commit/75ea3fe05650fc6ca09046a72493e2b3f066fb98
    category: security
    cwe: CWE-377
    technology:
    - java
  pattern-not-inside: "class $CLASS {\n    ...\n    private File createTempFileInSystemDir(String\
    \ prefix, String suffix) throws IOException {\n        ...\n        Set<PosixFilePermission>\
    \ ownerOnly = PosixFilePermissions.fromString(\"rw-------\");\n        FileAttribute\
    \ fileAttribute = PosixFilePermissions.asFileAttribute(ownerOnly);\n        return\
    \ Files.createTempFile(prefix, suffix, fileAttribute).toFile();\n    }\n    ...\n\
    }"
