rules:
- id: vuln-notesnook-e87f5e5f
  patterns:
  - pattern: 'const $ANCHOR = document.createElement("a");

      $ANCHOR.href = $SRC;

      ...

      $ANCHOR.outerHTML

      '
  - pattern-not: 'const $ANCHOR = document.createElement("a");

      $ANCHOR.href = `${$SRC}?ref_src=twsrc%5Etfw`;

      ...

      $ANCHOR.outerHTML

      '
  message: Potential XSS vulnerability due to unescaped user input in anchor href
    attribute. The src value is directly inserted into the href without proper sanitization,
    which could allow attackers to inject malicious URLs or JavaScript code. Fix by
    properly escaping or validating the src input before constructing the href.
  severity: ERROR
  languages:
  - typescript
  metadata:
    source-url: github.com/streetwriters/notesnook/commit/e87f5e5f899f45df28d7c0f33f15e9178d1fbcb7
    category: security
    cwe:
    - 79
    technology:
    - typescript
