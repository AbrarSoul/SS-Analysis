rules:
- id: vuln-semantic-versioning-plugin-8df2fabd
  pattern: 'DocumentBuilderFactory.newInstance().newDocumentBuilder()

    '
  pattern-not: 'DocumentBuilderFactory df = DocumentBuilderFactory.newInstance();

    df.setAttribute(XMLConstants.ACCESS_EXTERNAL_DTD, "");

    df.setAttribute(XMLConstants.ACCESS_EXTERNAL_SCHEMA, "");

    df.newDocumentBuilder();

    '
  languages:
  - java
  message: Insecure XML parsing vulnerability. The code creates a DocumentBuilder
    without setting security restrictions for external DTDs and schemas, which can
    lead to XXE attacks. Fix by setting ACCESS_EXTERNAL_DTD and ACCESS_EXTERNAL_SCHEMA
    attributes to empty strings.
  severity: ERROR
  metadata:
    source-url: github.com/jenkinsci/semantic-versioning-plugin/commit/8df2fabd7d7396ae29c374914d1357744d3e454f
    category: security
    cwe: CWE-611
    owasp: OWASP-M01
    technology: java
    references:
    - https://owasp.org/www-project-top-ten/OWASP_Top_Ten_2017/Top_10-2017_A04-XML_External_Entities_(XXE)
    - https://docs.oracle.com/javase/tutorial/jaxp/properties/index.html
    vulnerability-category: XXE
  pattern-inside: "class $CLASS {\n    ...\n    DocumentBuilder $VAR = ...;\n    ...\n\
    }"
