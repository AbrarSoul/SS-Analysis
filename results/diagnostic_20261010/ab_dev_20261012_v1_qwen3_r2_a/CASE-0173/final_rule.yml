rules:
- id: vuln-hono-cf9a78db
  pattern: 'const $KEY = $MANIFEST[$PATH] || $PATH;

    '
  pattern-not: 'const $KEY = $MANIFEST[$PATH];

    '
  languages:
  - typescript
  message: 'This code uses a fallback to the original path when a manifest key is
    not found, which can lead to path traversal vulnerabilities. The vulnerability
    occurs when user input is used as a key and falls back to the raw input, potentially
    allowing access to unintended resources. To fix this, remove the fallback and
    only use the manifest lookup result.

    '
  severity: ERROR
  metadata:
    source-url: github.com/honojs/hono/commit/cf9a78db4d0a19b117aee399cbe9d3a6d9bfd817
    category: security
    cwe:
    - CWE-22
    owasp:
    - OWASP Top 10:2021 - A01:2021 - Broken Access Control
    references:
    - https://owasp.org/www-project-top-ten/OWASP_Top_Ten_2021/Top_10_A01_Broken_Access_Control
    technology:
    - typescript
