rules:
- id: vuln-sagemaker-python-sdk-2d873d53
  pattern: os.system($COMMAND)
  pattern-not: subprocess.run($COMMAND, check=True, capture_output=True)
  pattern-inside: 'import os

    ...

    '
  languages:
  - python
  message: Use of os.system() detected. This is vulnerable to command injection attacks.
    Replace with subprocess.run() to prevent arbitrary code execution and improve
    security.
  severity: ERROR
  metadata:
    source-url: github.com/aws/sagemaker-python-sdk/commit/2d873d53f708ea570fc2e2a6974f8c3097fe9df5
    category: security
    cwe: CWE-78
    owasp: A01:2021-Broken Access Control
    references:
    - https://docs.python.org/3/library/os.html#os.system
    - https://docs.python.org/3/library/subprocess.html#subprocess.run
    technology: python
