rules:
- id: vuln-ckeditor-oembed-plugin-10f6169e
  patterns:
  - pattern: div(embeddedContent,oembed-provider-*) script
  - pattern-not: div(embeddedContent,oembed-provider-*) script
  - pattern-not: 'attributes: ''*'''
  languages:
  - javascript
  message: Potential XSS vulnerability in CKEditor oEmbed plugin. The removed configuration
    allowed arbitrary script attributes in embedded content, enabling attackers to
    inject malicious scripts. This vulnerability could allow remote code execution
    or data theft. Fix by removing the dangerous attribute wildcard configuration
    that permitted unrestricted script execution.
  severity: ERROR
  metadata:
    category: security
    cwe: CWE-79
    owasp: OWASP-A03:2021
    source-url: github.com/w8tcha/CKEditor-oEmbed-Plugin/commit/10f6169e39510bbf5af913886037044458b9dc9b
    technology:
    - javascript
