rules:
- id: vuln-notesnook-e87f5e5f
  patterns:
  - pattern: '$X.innerHTML = "...$Y...";

      '
  - pattern-not: '$X.innerHTML = "...$Y.outerHTML...";

      '
  languages:
  - typescript
  message: Potential XSS vulnerability due to untrusted data directly inserted into
    innerHTML. Use .outerHTML or proper escaping instead of direct string interpolation.
  severity: ERROR
  metadata:
    source-url: github.com/streetwriters/notesnook/commit/e87f5e5f899f45df28d7c0f33f15e9178d1fbcb7
    category: security
    cwe: CWE-79
    technology:
    - typescript
