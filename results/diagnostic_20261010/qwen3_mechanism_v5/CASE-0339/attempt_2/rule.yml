rules:
- id: vuln-trilium-4c3fcc3e
  pattern: $RESULT.highlightedNotePathTitle = $RESULT.notePathTitle.replace(/[<\{\}]/g,
    '');
  pattern-not: $RESULT.highlightedNotePathTitle = $RESULT.notePathTitle.replace(/[<{}]/g,
    '');
  languages:
  - javascript
  message: Potential insecure regex pattern in replace operation. The original regex
    /[<\{\}]/g includes a backslash-escaped brace which may be vulnerable to injection
    or incorrect escaping. Remove the unnecessary escape to fix the vulnerability.
  severity: WARNING
  metadata:
    source-url: github.com/zadam/trilium/commit/4c3fcc3ea6f37debcb87ac1a7f5698c27be0e67b
    category: security
    cwe: CWE-117
    technology:
    - javascript
