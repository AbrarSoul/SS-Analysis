rules:
- id: vuln-semantic-versioning-plugin-8df2fabd
  patterns:
  - pattern: 'DocumentBuilderFactory.newInstance()

      '
  - pattern: '.newDocumentBuilder()

      '
  pattern-not: 'df.setAttribute(XMLConstants.ACCESS_EXTERNAL_SCHEMA, "");

    '
  languages:
  - java
  message: Insecure XML processing vulnerability (XXE). The code creates a DocumentBuilderFactory
    without setting ACCESS_EXTERNAL_DTD and ACCESS_EXTERNAL_SCHEMA attributes to empty
    strings, which allows external entity resolution and can lead to XXE attacks.
    Fix by setting these attributes to empty strings after calling newInstance().
  severity: ERROR
  metadata:
    source-url: github.com/jenkinsci/semantic-versioning-plugin/commit/8df2fabd7d7396ae29c374914d1357744d3e454f
    category: security
    cwe: CWE-611
    technology:
    - java
