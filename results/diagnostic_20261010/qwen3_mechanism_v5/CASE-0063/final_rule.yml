rules:
- id: vuln-jspdf-d8bb3b39
  pattern-either:
  - pattern: /^data:(\w*\/\w*);*(charset=[\w=-]*)*;*$/.exec(...)
  - pattern: RegExp("^data:(\\w*\\/\\w*);*(charset=[\\w=-]*)*;*$").exec(...)
  pattern-not: /^data:(\w*\/\w*);*(charset=(?!charset=)[\w=-]*)*;*$/.exec(...)
  languages:
  - javascript
  message: Potential vulnerability in data URI parsing where charset parameter can
    be manipulated to bypass validation. The regex pattern allows for unsafe charset
    handling that could lead to unexpected behavior or security issues when processing
    image data URIs. Fix by ensuring charset parameter is properly validated using
    negative lookahead assertion.
  severity: ERROR
  metadata:
    source-url: github.com/MrRio/jsPDF/commit/d8bb3b39efcd129994f7a3b01b632164144ec43e
    category: security
    cwe: CWE-20
    technology:
    - javascript
