rules:
- id: vuln-thrift-0919c3d5
  pattern-either:
  - patterns:
    - pattern: $SOCKET.getSSLParameters(...)
    - pattern: $SOCKET.setSSLParameters(...)
    - pattern-not: '$SOCKET.getSSLParameters(...);

        ...

        $SOCKET.setSSLParameters($PARAMS);

        ...

        $PARAMS.setEndpointIdentificationAlgorithm("HTTPS");

        '
  - patterns:
    - pattern: $SOCKET.getSSLParameters(...)
    - pattern: $PARAMS.setEndpointIdentificationAlgorithm(...)
    - pattern-not: '$SOCKET.getSSLParameters(...);

        ...

        $SOCKET.setSSLParameters($PARAMS);

        ...

        $PARAMS.setEndpointIdentificationAlgorithm("HTTPS");

        '
  languages:
  - java
  message: Missing endpoint identification algorithm configuration in SSL/TLS connections.
    This vulnerability allows for man-in-the-middle attacks by disabling hostname
    verification. Fix by setting 'HTTPS' as the endpoint identification algorithm
    using setEndpointIdentificationAlgorithm().
  severity: ERROR
  metadata:
    source-url: github.com/apache/thrift/commit/0919c3d5506151514e283a63e1fe1ce83e2449d8
    category: security
    cwe:
    - CWE-295
    technology:
    - java
